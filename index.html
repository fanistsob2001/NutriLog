<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriLog</title>
<meta name="theme-color" content="#2f9e5b">
<meta name="description" content="Καταγραφή θερμίδων και μακροθρεπτικών, streak προόδου και AI ανάλυση γευμάτων.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutriLog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f6f2;--card:#ffffff;--card2:#f0f2ec;--text:#1c2320;--muted:#6a746e;--border:#e1e5df;
  --accent:#2f9e5b;--accent2:#1f7a44;--accent-soft:#e2f3e8;--accent-text:#1f7a44;
  --warn:#e8962a;--warn-soft:#fcefd9;--danger:#d64545;--danger-soft:#fbe3e3;--none:#e6e9e3;
  --protein:#3b82f6;--carbs:#f2a516;--fat:#e0508f;--fiber:#10a37f;--sugar:#9b5de5;--water:#0ea5e9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513;--card:#1a201d;--card2:#222a26;--text:#e8ede9;--muted:#95a09a;--border:#2b3430;
    --accent:#3fbf72;--accent2:#2f9e5b;--accent-soft:#1d3a29;--accent-text:#7fdca3;
    --warn:#f0a640;--warn-soft:#3a2d17;--danger:#ef6464;--danger-soft:#3d1f1f;--none:#262e2a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#111513;--card:#1a201d;--card2:#222a26;--text:#e8ede9;--muted:#95a09a;--border:#2b3430;
  --accent:#3fbf72;--accent2:#2f9e5b;--accent-soft:#1d3a29;--accent-text:#7fdca3;
  --warn:#f0a640;--warn-soft:#3a2d17;--danger:#ef6464;--danger-soft:#3d1f1f;--none:#262e2a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.in-app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .in{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{font-weight:750;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px;font-weight:800}
.top-r{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:14px}
.sync{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.sync.saving,.sync.pending{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.sync.offline,.sync.error{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent-text);font-weight:750;overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
main{max-width:760px;margin:0 auto;padding:4px 16px 24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin-bottom:0}
.mb{margin-bottom:14px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:19px;display:grid;place-items:center;flex:none;color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:default}
.btn{border:1px solid var(--border);background:var(--card);border-radius:13px;padding:10px 16px;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn.lg{padding:13px 18px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent-text);cursor:pointer;padding:0;font-weight:650}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--border);background:var(--card2);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.greet{font-size:23px;font-weight:780;letter-spacing:-.025em;margin:8px 0 0}
.greet-sub{color:var(--muted);font-size:14px;margin-bottom:10px}

/* date bar */
.datebar{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.date-title{flex:1;text-align:center;display:flex;flex-direction:column}
.date-title strong{font-size:16px}
.date-title span{font-size:13px;color:var(--muted)}

/* hero */
.hero{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--none);stroke-width:13}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .5s}
.ring-fg.over{stroke:var(--danger)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-size:28px;letter-spacing:-.03em;line-height:1}
.ring-txt span{font-size:12px;color:var(--muted);margin-top:4px}
.hero-side{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:20px}
.stat b.neg{color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12.5px;font-weight:650;align-self:flex-start;white-space:nowrap}
.badge.hit{background:var(--accent-soft);color:var(--accent-text)}
.badge.miss{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:var(--none);color:var(--muted)}

/* macro bars */
.macros{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.mbar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mbar .lbl b{font-weight:650}
.mbar .lbl span{color:var(--muted)}
.track{height:8px;background:var(--none);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .4s}

/* water */
.water-row{display:flex;align-items:center;gap:10px}
.water-val{flex:1;text-align:center}
.water-val b{font-size:20px}
.drops{display:flex;gap:3px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.drop{width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--none)}
.drop.on{background:var(--water)}

/* meals */
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.meal-head h3{margin:0;display:flex;align-items:center;gap:8px}
.meal-head .kc{color:var(--muted);font-size:14px;font-weight:600}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .nm small{color:var(--muted);font-size:12.5px}
.entry .kc{font-weight:700;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;width:30px;height:30px;border-radius:8px;flex:none}
.del:hover{background:var(--danger-soft);color:var(--danger)}
.add-btn{margin-top:8px;width:100%;border:1.5px dashed var(--border);background:transparent;border-radius:12px;padding:9px;cursor:pointer;color:var(--accent-text);font-weight:650}
.add-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.ai-tag{font-size:10.5px;background:var(--accent-soft);color:var(--accent-text);padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700;vertical-align:1px}
.tip{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--card));border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px}
.tip .e{font-size:26px}
.tip div{flex:1;font-size:14px}

/* segmented */
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:13px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* streak cards */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.sc .e{font-size:22px}
.sc b{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.sc span{font-size:12px;color:var(--muted)}
.sc.fire{background:linear-gradient(160deg,var(--warn-soft),var(--card))}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:650;padding-bottom:2px}
.cell{aspect-ratio:1/1;border-radius:11px;background:var(--none);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;min-width:0;color:var(--text)}
.cell .dn{font-weight:700;font-size:14px}
.cell .dk{font-size:10px;opacity:.8;white-space:nowrap}
.cell.hit{background:var(--accent);color:#fff}
.cell.miss{background:var(--warn-soft);color:var(--warn)}
.cell.today{outline:2px solid var(--text);outline-offset:1px}
.cell.future{opacity:.4;cursor:default}
.cell.empty{background:transparent;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.heat i{border-radius:3px;background:var(--none)}
.heat i.hit{background:var(--accent)}
.heat i.miss{background:var(--warn)}
.heat i.blank{background:transparent}
.heat i.future{opacity:.35}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .bar.hit{fill:var(--accent)}
.chart .bar.miss{fill:var(--warn)}
.chart .bar.none{fill:var(--none)}
.chart .gl{stroke:var(--text);stroke-dasharray:5 5;opacity:.45}
.chart .grid{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart text.v{fill:var(--text);font-weight:650}
.chart .ln{fill:none;stroke:var(--protein);stroke-width:2.5;stroke-linejoin:round}
.chart .pt{fill:var(--protein)}
.avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avg{background:var(--card2);border-radius:12px;padding:10px}
.avg span{display:block;font-size:12px;color:var(--muted)}
.avg b{font-size:17px}
.avg small{color:var(--muted)}
.period-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.period-nav div{flex:1;text-align:center;font-weight:700}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt td,table.nt th{padding:8px 4px;border-top:1px solid var(--border);text-align:right}
table.nt th{font-size:12px;color:var(--muted);font-weight:650;border-top:0}
table.nt td:first-child,table.nt th:first-child{text-align:left}

/* AI scan */
.drop-zone{border:2px dashed var(--border);border-radius:16px;padding:22px;text-align:center;background:var(--card2);transition:.2s}
.drop-zone.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone .big{font-size:38px}
.preview{width:100%;max-height:340px;object-fit:cover;border-radius:14px;display:block}
.ai-items .it{display:grid;grid-template-columns:24px 1fr 86px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.ai-items .it input[type=text]{padding:6px 8px;font-weight:600}
.ai-items .it input[type=number]{padding:6px 8px;text-align:right}
.ai-items .it small{grid-column:2/4;color:var(--muted);font-size:12.5px;margin-top:-4px}
.ai-items .it.off{opacity:.45}
.note{background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:12px;font-size:14px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px;font-size:14px;word-break:break-word}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--none);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:600}
.tabbar button .ic{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--accent-text)}
.tabbar button.on .ic{background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(82px + env(safe-area-inset-bottom));height:52px;padding:0 18px 0 14px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(31,122,68,.35);cursor:pointer;z-index:9}
.fab span{font-size:20px}

/* dialogs */
dialog.sheet{border:0;padding:0;background:var(--card);color:var(--text);border-radius:24px;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 30px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.sheet::backdrop{background:rgba(10,15,12,.5)}
.sheet-in{padding:16px;display:flex;flex-direction:column;max-height:calc(100dvh - 30px)}
dialog.tall .sheet-in{height:min(720px,calc(100dvh - 30px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:17px}
.results{overflow-y:auto;max-height:52vh;margin-top:10px;margin-right:-6px;padding-right:6px}
.results h5{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.food-row{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--border);padding:10px 4px;cursor:pointer;border-radius:8px}
.food-row:hover{background:var(--card2)}
.food-row span{flex:1;min-width:0}
.food-row b{display:block;font-weight:600}
.food-row small{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chip{border:1px solid var(--border);background:var(--card2);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.prev div{background:var(--card2);border-radius:11px;padding:8px;text-align:center}
.prev b{display:block;font-size:17px}
.prev span{font-size:11.5px;color:var(--muted)}
.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)}
.info{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
a{color:var(--accent-text)}

/* profile */
.acct{display:flex;align-items:center;gap:14px}
.acct .avatar{width:58px;height:58px;font-size:22px;cursor:default}
.goal-hero{display:flex;align-items:baseline;gap:6px}
.goal-hero b{font-size:36px;letter-spacing:-.03em;line-height:1.1}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gchip{padding:6px 10px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:600}
.gchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.setrow.first{border-top:0;padding-top:0}
.setrow .t{min-width:0}
.setrow .t b{display:block;font-weight:650}
.setrow .t small{color:var(--muted);font-size:12.5px}
.switch{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--none);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0}
details.acc{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
details.acc summary{cursor:pointer;font-weight:650;color:var(--accent-text);list-style:none;padding:4px 0}
details.acc summary::-webkit-details-marker{display:none}

/* wizard */
.wz-hero{font-size:44px;text-align:center;margin-top:6px}
.wz h2{margin:6px 0 4px;font-size:21px;letter-spacing:-.02em;text-align:center}
.wz>p{text-align:center;margin:0 0 8px}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--none);transition:.25s}
.dots i.on{width:22px;background:var(--accent)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--border);border-radius:15px;background:var(--card);cursor:pointer;margin-bottom:8px;color:var(--text)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{font-size:24px;width:32px;text-align:center}
.opt b{display:block}
.opt small{color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:12px;background:var(--card2);overflow:hidden}
.stepper button{width:36px;height:44px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--accent-text);flex:none}
.stepper input{border:0!important;background:none!important;text-align:center;padding:8px 0!important;border-radius:0!important;font-weight:700;box-shadow:none!important;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.wz-foot{display:flex;gap:10px;margin-top:16px}
.wz-foot .btn{flex:1}
.wz-body{overflow-y:auto;margin:0 -4px;padding:0 4px}

/* chat */
.bot-h{display:flex;align-items:center;gap:10px}
.bot-av{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.bot-h h3{margin:0;font-size:16px}
.bot-h small{font-size:12px}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;min-height:200px}
.bubble{max-width:88%;padding:10px 13px;border-radius:17px;font-size:14.5px;line-height:1.5;word-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
.bubble.model{align-self:flex-start;background:var(--card2);border-bottom-left-radius:5px}
.bubble.err{background:var(--danger-soft);color:var(--danger)}
.bubble p{margin:0 0 7px}.bubble p:last-child{margin:0}
.bubble ul{margin:4px 0 7px;padding-left:20px}.bubble li{margin:2px 0}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.chat-form{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);align-items:flex-end}
.chat-form textarea{resize:none;max-height:120px;border-radius:14px}
.chat-form .btn{height:44px;width:48px;padding:0;flex:none;font-size:18px}

/* auth */
.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(900px 420px at 50% -8%,var(--accent-soft),transparent 70%),var(--bg)}
.auth-card{width:100%;max-width:410px}
.auth-top{text-align:center;margin-bottom:22px}
.auth-top .logo{width:62px;height:62px;border-radius:20px;font-size:30px;margin:0 auto 12px;box-shadow:0 10px 30px rgba(31,122,68,.3)}
.auth-top h1{margin:0;font-size:28px;letter-spacing:-.03em}
.auth-top p{margin:6px 0 0;color:var(--muted)}
.feat{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.feat span{font-size:12.5px;background:var(--card);border:1px solid var(--border);padding:5px 10px;border-radius:99px;font-weight:600}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.07)}
.gbtn{width:100%;background:var(--card);border:1px solid var(--border);padding:12px;font-size:15.5px}
.gbtn:hover{background:var(--card2)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:18px 0 14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.pw{position:relative}
.pw input{padding-right:46px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;width:38px;height:38px;border-radius:10px;color:var(--muted)}
.msg{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.msg.ok{background:var(--accent-soft);color:var(--accent-text)}
.msg.bad{background:var(--danger-soft);color:var(--danger)}
.auth-foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
.splash{min-height:100dvh;display:grid;place-items:center}

@media (max-width:560px){
  .hero{flex-direction:column;align-items:stretch}
  .ring{margin:0 auto}
  .hero-side{flex-direction:row;flex-wrap:wrap;justify-content:space-between}
  .macros{grid-template-columns:1fr}
  .stats4{grid-template-columns:repeat(2,1fr)}
  .avg-grid{grid-template-columns:repeat(2,1fr)}
  .form3{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .cell .dk{display:none}
  .fab{padding:0;width:54px;justify-content:center}
  .fab b{display:none}
  .auth-box{padding:18px}
  dialog.sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:94dvh}
  .sheet-in{max-height:94dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  dialog.tall .sheet-in{height:94dvh}
}

function normalize(r){

  const settings={...d.settings,...r.settings};
  delete settings.apiKey;delete settings.autoModel; // το κλειδί ζει πλέον μόνο στον server
  if(settings.model==='gemini-2.5-flash')settings.model='';
  const days=r.days&&typeof r.days==='object'?r.days:{};
  return{profile:{...d.profile,...r.profile},goals:{...d.goals,...r.goals},settings,
    customFoods:Array.isArray(r.customFoods)?r.customFoods:[],days,
    onboarded:r.onboarded!==undefined?!!r.onboarded:Object.keys(days).length>0,updatedAt:+r.updatedAt||0};
}

function totals(k){const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0};const d=S.days[k];if(d&&d.entries)for(const e of d.entries)for(const n of NK)t[n]+=+e[n]||0;return t}
function status(k){
  const d=S.days[k];if(!d||!d.entries||!d.entries.length)return'none';
  const t=totals(k),g=S.goals,tol=(+S.settings.tolerance||10)/100;
  let ok=Math.abs(t.kcal-g.kcal)<=g.kcal*tol;
  if(ok&&S.settings.requireProtein)ok=t.protein>=g.protein*0.9;
  return ok?'hit':'miss';
}
function streaks(){
  let cur=0,d=new Date();
  if(status(dk(d))!=='hit')d=addDays(d,-1);
  while(status(dk(d))==='hit'){cur++;d=addDays(d,-1)}
  const hits=Object.keys(S.days).filter(k=>status(k)==='hit').sort();
  let best=0,run=0,prev=null;
  for(const k of hits){run=(prev&&Math.round((pk(k)-pk(prev))/864e5)===1)?run+1:1;best=Math.max(best,run);prev=k}
  const logged=Object.keys(S.days).filter(k=>status(k)!=='none').length;
  return{cur,best,hits:hits.length,logged};
}
function dayObj(k){if(!S.days[k])S.days[k]={entries:[],water:0};if(!S.days[k].entries)S.days[k].entries=[];return S.days[k]}
function addEntry(k,e){dayObj(k).entries.push({id:uid(),...e});save()}
function scaled(per,g){const o={};for(const n of NK)o[n]=r1((+per[n]||0)*g/100);return o}
function statusText(k){const st=status(k);if(st==='none')return['none','Καμία καταγραφή'];if(st==='hit')return['hit','✓ Εντός στόχου'];return['miss',totals(k).kcal<S.goals.kcal?'Κάτω από τον στόχο':'Πάνω από τον στόχο']}
function calcGoals(p){
  const w=+p.weight,bmr=10*w+6.25*(+p.height)-5*(+p.age)+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.activity),adj={lose:-500,lose_slow:-250,maintain:0,gain:300}[p.goal]||0;
  const kcal=Math.round((tdee+adj)/10)*10,protein=Math.round(w*(p.goal==='maintain'?1.6:p.goal==='gain'?1.8:2.0));
  const fat=Math.round(kcal*0.27/9),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return{bmr,tdee,goals:{kcal,protein,carbs,fat,fiber:Math.round(kcal/1000*14),sugar:Math.round(kcal*0.1/4),water:Math.round(w*35/250)*250}};
}

const cacheKey=()=>'nutrilog-u-'+user.id;

async function pushNow(){
  if(DEMO||!user||!sb)return;clearTimeout(pushT);clearTimeout(retryT);
  if(!navigator.onLine){setSync('offline');return}
  setSync('saving');
  const {error}=await sb.from('user_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});
  if(error){console.error(error);setSync('error');retryT=setTimeout(pushNow,15000)}else setSync('ok');
}
async function pullCloud(){
  const {data,error}=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();
  if(error)throw error;return data?data.data:null;
}
async function loadData(){
  let local=null;try{local=JSON.parse(localStorage.getItem(cacheKey()))}catch(e){}
  let cloud=null,cloudOk=false;
  if(!DEMO){try{cloud=await pullCloud();cloudOk=true}catch(e){console.error(e)}}
  let src=cloud&&local?((+local.updatedAt||0)>(+cloud.updatedAt||0)?local:cloud):(cloud||local),migrated=false;
  if(!src){ // πρώτη σύνδεση: φέρνουμε τα δεδομένα της παλιάς έκδοσης (χωρίς λογαριασμό) αν υπάρχουν
    try{const old=JSON.parse(localStorage.getItem('nutrilog-v1'));if(old){src=old;migrated=true}}catch(e){}
  }
  S=normalize(src);
  if(migrated){S.onboarded=true;S.updatedAt=Date.now();try{localStorage.removeItem('nutrilog-v1')}catch(e){}}
  writeCache();
  if(DEMO)return;
  if(!cloudOk)setSync('offline');
  else if(src!==cloud)pushNow(); else setSync('ok');
}
function syncText(){return DEMO?'Λειτουργία demo — τα δεδομένα μένουν τοπικά':{ok:'☁️ Όλα αποθηκευμένα στον λογαριασμό σου',saving:'☁️ Αποθήκευση…',pending:'☁️ Αποθήκευση σε λίγο…',offline:'📴 Εκτός σύνδεσης — θα συγχρονιστεί μόλις συνδεθείς',error:'⚠️ Πρόβλημα συγχρονισμού — γίνεται νέα προσπάθεια'}[syncState]}

async function callAI(body){

  if(!navigator.onLine)throw new Error('Δεν υπάρχει σύνδεση στο ίντερνετ.');
  const {data,error}=await sb.functions.invoke('ai',{body:{...body,model:S.settings.model||''}});
  if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||msg}catch(e){}throw new Error(msg)}

}

  authBusy=true;authMsg=null;renderAuth();
  try{
    if(mode==='signin'){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error}
    else if(mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:v('aName')},emailRedirectTo:APP_URL}});
      if(error)throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(!data.session){authMsg=['ok',`Σου στείλαμε email στο ${email}. Πάτα τον σύνδεσμο για να ενεργοποιήσεις τον λογαριασμό σου.`];authView='signin'}
    }else if(mode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(error)throw error;
      authMsg=['ok','Αν υπάρχει λογαριασμός με αυτό το email, θα λάβεις σύνδεσμο σε λίγα λεπτά.'];
    }else if(mode==='reset'){
      const {data,error}=await sb.auth.updateUser({password:pw});if(error)throw error;
      recovery=false;authBusy=false;toast('Ο κωδικός άλλαξε');user=data.user;startApp();return;
    }
  }catch(e){authMsg=['bad',authErr(e)]}
  authBusy=false;if(!user||recovery)renderAuth();
}

/* ---------- Εκκίνηση ---------- */
async function boot(){
  applyTheme('auto');
  const qp=new URLSearchParams(location.search+'&'+location.hash.slice(1));
  if(qp.get('error_description'))authMsg=['bad',authErr(qp.get('error_description'))];
  if(DEMO){user={id:'demo',email:'demo@localhost',user_metadata:{full_name:'Demo'},app_metadata:{provider:'email'}};await startApp();return}
  if(!sb){renderAuth('signin');return}
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){recovery=true;setTimeout(()=>renderAuth('reset'),0);return}
    if(ev==='SIGNED_OUT'){setTimeout(onSignedOut,0);return}
    if(session&&session.user){const u=session.user;setTimeout(()=>{if(recovery)return;if(appUid!==u.id){user=u;startApp()}else user=u},0)}
  });
  const {data}=await sb.auth.getSession();
  if(!data.session&&!recovery)renderAuth('signin');
}
async function startApp(){
  if(appUid===user.id)return;appUid=user.id;
  showScreen('splash');
  await loadData();loadChat();applyTheme(S.settings.theme);
  if(location.search||location.hash)history.replaceState(null,'',APP_URL);
  tab='today';curDate=new Date();showScreen('app');render();
  if(!S.onboarded)openWizard(true);
}
function onSignedOut(){user=null;appUid=null;S=defState();chat.msgs=[];models={list:null,auto:'',loading:false,err:''};
  ['#dlg','#wizDlg','#chatDlg'].forEach(s=>{const d=$(s);if(d.open)d.close()});authMsg=null;applyTheme('auto');renderAuth('signin')}

function macroBar(n,val,goal){
  const pct=goal?Math.min(100,val/goal*100):0;
  const over=n==='sugar'&&val>goal;
  return`<div class="mbar"><div class="lbl"><b>${NL[n]}${n==='sugar'?' <span class="small">(όριο)</span>':''}</b><span>${r0(val)} / ${r0(goal)} g</span></div>
  <div class="track"><div class="fill" style="width:${pct}%;background:${over?'var(--danger)':NC[n]}"></div></div></div>`;
}

/* ---------- Charts ---------- */
function barChart(items,goal,H=210){
  const W=640,pl=40,pr=10,pt=18,pb=26,n=items.length;
  const max=Math.max(goal*1.25,...items.map(i=>i.v),1);
  const cw=(W-pl-pr)/n,bw=Math.max(3,Math.min(40,cw*.68));
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Γράφημα θερμίδων">`;
  const step=max>3000?1000:500;
  for(let v=0;v<=max;v+=step)s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  items.forEach((it,i)=>{
    const x=pl+cw*i+(cw-bw)/2;
    if(it.v>0)s+=`<rect class="bar ${it.c}" x="${x}" y="${y(it.v)}" width="${bw}" height="${Math.max(1,y(0)-y(it.v))}" rx="${Math.min(5,bw/3)}"><title>${esc(it.t||'')}</title></rect>`;
    else s+=`<rect class="bar none" x="${x}" y="${y(0)-3}" width="${bw}" height="3" rx="1.5"/>`;
    if(n<=12&&it.v>0)s+=`<text class="v" x="${x+bw/2}" y="${y(it.v)-5}" text-anchor="middle">${r0(it.v)}</text>`;
    if(n<=12||i%(n>20?2:1)===0)s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W-pr}" y="${y(goal)-5}" text-anchor="end">στόχος ${r0(goal)}</text></svg>`;
  return s;
}
function lineChart(pts,H=170){
  if(pts.length<2)return`<p class="muted small">Καταχώρησε βάρος σε τουλάχιστον 2 μέρες αυτής της περιόδου για να δεις γράφημα.</p>`;
  const W=640,pl=40,pr=12,pt=14,pb=24;
  const vs=pts.map(p=>p.v),mn=Math.floor(Math.min(...vs)-1),mx=Math.ceil(Math.max(...vs)+1);
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
  const x=t=>pl+(W-pl-pr)*((t-t0)/((t1-t0)||1)),y=v=>pt+(H-pt-pb)*(1-(v-mn)/((mx-mn)||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Γράφημα βάρους">`;
  for(const v of [mn,(mn+mx)/2,mx])s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${r1(v)}</text>`;
  s+=`<polyline class="ln" points="${pts.map(p=>`${x(p.t)},${y(p.v)}`).join(' ')}"/>`;
  pts.forEach(p=>s+=`<circle class="pt" cx="${x(p.t)}" cy="${y(p.v)}" r="3.5"><title>${esc(p.l)}: ${p.v} kg</title></circle>`);
  s+=`<text x="${pl}" y="${H-6}">${esc(pts[0].l)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1].l)}</text></svg>`;
  return s;
}
function weightCard(keys){
  const pts=keys.filter(k=>S.days[k]&&S.days[k].weight).map(k=>({t:pk(k).getTime(),v:+S.days[k].weight,l:fmtDate(pk(k),{day:'numeric',month:'short'})}));
  let diff='';
  if(pts.length>=2){const d=r1(pts[pts.length-1].v-pts[0].v);diff=`<span class="badge ${d<=0?'hit':'miss'}" style="float:right">${d>0?'+':''}${String(d).replace('.',',')} kg</span>`}
  return`<section class="card"><h3>⚖️ Βάρος ${diff}</h3>${lineChart(pts)}</section>`;
}
function avgBlock(keys,title){
  const lk=keys.filter(k=>status(k)!=='none'),hits=keys.filter(k=>status(k)==='hit').length;
  if(!lk.length)return`<section class="card"><h3>${title}</h3><p class="muted">Δεν υπάρχουν καταγραφές σε αυτή την περίοδο.</p></section>`;
  const sum={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0};
  lk.forEach(k=>{const t=totals(k);NK.forEach(n=>sum[n]+=t[n])});
  const w=lk.map(k=>S.days[k].water||0),avgW=w.reduce((a,b)=>a+b,0)/lk.length;
  return`<section class="card"><h3>${title}</h3>
   <div class="avg-grid">
    ${NK.map(n=>`<div class="avg"><span>${NL[n]}</span><b>${r0(sum[n]/lk.length)}</b> <small>/ ${r0(S.goals[n])} ${NU[n]}</small></div>`).join('')}
   </div>
   <div class="info">✅ Επιτυχία στόχου σε <b>${hits}</b> από <b>${lk.length}</b> μέρες καταγραφής (${r0(hits/lk.length*100)}%) · 💧 μέσος όρος νερού ${(avgW/1000).toFixed(1).replace('.',',')} L</div>
  </section>`;
}

/* ---------- Πρόοδος ---------- */
function renderProgress(){
  const s=streaks(),a=prog.anchor,today=new Date();
  let h=`<div class="stats4">
    <div class="sc fire"><div class="e">🔥</div><b>${s.cur}</b><span>τρέχον streak</span></div>
    <div class="sc"><div class="e">🏆</div><b>${s.best}</b><span>καλύτερο streak</span></div>
    <div class="sc"><div class="e">✅</div><b>${s.hits}</b><span>μέρες επιτυχίας</span></div>
    <div class="sc"><div class="e">📒</div><b>${s.logged}</b><span>μέρες καταγραφής</span></div></div>
  <div class="seg">${[['day','Ημέρα'],['week','Εβδομάδα'],['month','Μήνας'],['year','Έτος']].map(([v,l])=>`<button class="${prog.view===v?'on':''}" data-act="pview" data-v="${v}">${l}</button>`).join('')}</div>`;
  let title='',nextDis=false;
  if(prog.view==='day'){title=cap(fmtDate(a,{weekday:'short',day:'numeric',month:'long',year:'numeric'}));nextDis=dk(a)>=dk(today)}
  else if(prog.view==='week'){const m=mondayOf(a),e=addDays(m,6);title=`${fmtDate(m,{day:'numeric',month:'short'})} – ${fmtDate(e,{day:'numeric',month:'short',year:'numeric'})}`;nextDis=dk(e)>=dk(today)}
  else if(prog.view==='month'){title=cap(fmtDate(a,{month:'long',year:'numeric'}));nextDis=a.getFullYear()*12+a.getMonth()>=today.getFullYear()*12+today.getMonth()}
  else{title=String(a.getFullYear());nextDis=a.getFullYear()>=today.getFullYear()}
  h+=`<div class="period-nav"><button class="icon-btn" data-act="pnav" data-d="-1" aria-label="Προηγούμενο">‹</button><div>${title}</div><button class="icon-btn" data-act="pnav" data-d="1" ${nextDis?'disabled':''} aria-label="Επόμενο">›</button></div>`;
  if(prog.view==='day')h+=progDay(a);
  else if(prog.view==='week')h+=progWeek(a);
  else if(prog.view==='month')h+=progMonth(a);
  else h+=progYear(a);
  return h;
}
function progDay(a){
  const k=dk(a),t=totals(k),g=S.goals,d=S.days[k]||{},[sc,stxt]=statusText(k);
  let h=`<section class="card"><div class="meal-head"><h3>Σύνοψη ημέρας</h3><span class="badge ${sc}">${stxt}</span></div>
  <table class="nt"><tr><th>Θρεπτικό</th><th>Κατανάλωση</th><th>Στόχος</th><th>%</th></tr>
  ${NK.map(n=>`<tr><td>${NL[n]}</td><td><b>${r0(t[n])}</b> ${NU[n]}</td><td>${r0(g[n])}</td><td>${g[n]?r0(t[n]/g[n]*100):0}%</td></tr>`).join('')}
  <tr><td>Νερό</td><td><b>${r0(d.water||0)}</b> ml</td><td>${r0(g.water)}</td><td>${g.water?r0((d.water||0)/g.water*100):0}%</td></tr>
  ${d.weight?`<tr><td>Βάρος</td><td><b>${d.weight}</b> kg</td><td>—</td><td>—</td></tr>`:''}
  </table></section>`;
  const es=d.entries||[];
  if(es.length){
    h+=`<section class="card"><h3>Τι έφαγες</h3>`;
    for(const [m,name,ic] of MEALS){const x=es.filter(e=>e.meal===m);if(!x.length)continue;
      h+=`<div class="small muted" style="margin:10px 0 2px;font-weight:700">${ic} ${name}</div>`+x.map(e=>`<div class="entry"><div class="nm"><b>${esc(e.name)}</b><small>${e.grams?r0(e.grams)+' g · ':''}Π ${r1(e.protein)} · Υ ${r1(e.carbs)} · Λ ${r1(e.fat)}</small></div><span class="kc">${r0(e.kcal)}</span></div>`).join('')}
    h+=`</section>`;
  }
  h+=`<button class="btn block" data-act="editDay" data-k="${k}">✏️ Επεξεργασία αυτής της μέρας</button>`;
  return h;
}
function progWeek(a){
  const m=mondayOf(a),keys=Array.from({length:7},(_,i)=>dk(addDays(m,i)));
  const items=keys.map((k,i)=>({v:totals(k).kcal,c:status(k),l:WD[i],t:`${fmtDate(pk(k),{day:'numeric',month:'short'})}: ${r0(totals(k).kcal)} kcal`}));
  return`<section class="card"><h3>Θερμίδες ανά ημέρα</h3>${barChart(items,S.goals.kcal)}
    <div class="legend"><span><i style="background:var(--accent)"></i>Εντός στόχου</span><span><i style="background:var(--warn)"></i>Εκτός στόχου</span></div></section>
    ${avgBlock(keys,'Μέσοι όροι εβδομάδας')}${weightCard(keys)}`;
}
function progMonth(a){
  const y=a.getFullYear(),mo=a.getMonth(),days=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7,tk=todayK();
  const keys=Array.from({length:days},(_,i)=>dk(new Date(y,mo,i+1)));
  let cal=WD.map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="cell empty"></div>'.repeat(off);
  keys.forEach((k,i)=>{const st=status(k),fut=k>tk,t=totals(k);
    cal+=`<button class="cell ${st!=='none'?st:''} ${k===tk?'today':''} ${fut?'future':''}" ${fut?'disabled':''} data-act="gotoDay" data-k="${k}" title="${st==='none'?'Χωρίς καταγραφή':r0(t.kcal)+' kcal'}"><span class="dn">${i+1}</span>${st!=='none'?`<span class="dk">${r0(t.kcal)}</span>`:''}</button>`});
  const items=keys.map((k,i)=>({v:totals(k).kcal,c:status(k),l:String(i+1),t:`${i+1}/${mo+1}: ${r0(totals(k).kcal)} kcal`}));
  return`<section class="card"><h3>Ημερολόγιο</h3><div class="cal">${cal}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Εντός στόχου</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>Εκτός στόχου</span><span><i style="background:var(--none)"></i>Χωρίς καταγραφή</span><span>Πάτα μια μέρα για λεπτομέρειες</span></div></section>
    <section class="card"><h3>Θερμίδες ανά ημέρα</h3>${barChart(items,S.goals.kcal)}</section>
    ${avgBlock(keys,'Μέσοι όροι μήνα')}${weightCard(keys)}`;
}
function progYear(a){
  const y=a.getFullYear(),tk=todayK(),tol=(+S.settings.tolerance||10)/100;
  const items=[],allKeys=[];
  for(let m=0;m<12;m++){
    const n=new Date(y,m+1,0).getDate(),ks=Array.from({length:n},(_,i)=>dk(new Date(y,m,i+1)));allKeys.push(...ks);
    const lk=ks.filter(k=>status(k)!=='none'),hits=ks.filter(k=>status(k)==='hit').length;
    const avg=lk.length?lk.reduce((s,k)=>s+totals(k).kcal,0)/lk.length:0;
    items.push({v:avg,c:!lk.length?'none':Math.abs(avg-S.goals.kcal)<=S.goals.kcal*tol?'hit':'miss',l:MONTHS[m],t:`${MONTHS[m]}: μ.ό. ${r0(avg)} kcal · ${hits}/${lk.length} μέρες επιτυχίας`});
  }
  const off=(new Date(y,0,1).getDay()+6)%7;
  let heat='<i class="blank"></i>'.repeat(off);
  allKeys.forEach(k=>{const st=status(k);heat+=`<i class="${st!=='none'?st:''} ${k>tk?'future':''}" title="${fmtDate(pk(k),{day:'numeric',month:'short'})}${st!=='none'?' · '+r0(totals(k).kcal)+' kcal':''}"></i>`});
  return`<section class="card"><h3>Χάρτης συνέπειας</h3><div class="heat-wrap"><div class="heat">${heat}</div></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Εντός στόχου</span><span><i style="background:var(--warn)"></i>Εκτός στόχου</span><span><i style="background:var(--none)"></i>Χωρίς καταγραφή</span></div></section>
    <section class="card"><h3>Μέσες ημερήσιες θερμίδες ανά μήνα</h3>${barChart(items,S.goals.kcal)}</section>
    ${avgBlock(allKeys,'Μέσοι όροι έτους')}${weightCard(allKeys)}`;
}

/* ---------- Σάρωση γεύματος ---------- */
async function analyze(){
  if(!ai.b64&&!ai.desc.trim()){toast('Ανέβασε φωτογραφία ή γράψε μια περιγραφή');return}
  ai.loading=true;ai.error='';ai.result=null;render();
  try{
    const r=await callAI({action:'analyze',image:ai.b64||null,desc:ai.desc.trim(),context:aiContext()});
    const j=r.result||{};
    ai.result={isFood:j.is_food!==false,dish:j.dish||'',notes:j.notes||'',confidence:j.confidence||'medium',
      items:(j.items||[]).map(it=>{const g=+it.grams||0;const base={grams:g};NK.forEach(n=>base[n]=+it[n]||0);return{on:true,name:it.name||'Τρόφιμο',grams:g,base}})};
  }catch(e){ai.error=e.message||String(e)}
  ai.loading=false;if(tab==='ai')render();
}
function itemVals(it){const f=it.base.grams?it.grams/it.base.grams:1;const o={};NK.forEach(n=>o[n]=r1(it.base[n]*f));return o}
function renderAI(){
  const conf={low:'χαμηλή',medium:'μέτρια',high:'υψηλή'};
  let h=`<section class="card"><h3>📸 Σάρωση γεύματος</h3>
  <p class="muted small" style="margin-top:-6px">Τράβηξε ή ανέβασε φωτογραφία του πιάτου σου και το <b>Nutri AI</b> θα εκτιμήσει θερμίδες και μακροθρεπτικά για κάθε συστατικό. Μπορείς να γράψεις και μόνο περιγραφή.</p>`;
  h+=ai.img?`<img src="${ai.img}" class="preview" alt="Φωτογραφία γεύματος"><div class="row" style="margin-top:10px"><button class="btn" data-act="pickImg" data-src="gal">Αλλαγή φωτογραφίας</button><button class="btn" data-act="clearImg">Αφαίρεση</button></div>`
    :`<div class="drop-zone" id="dropZone"><div class="big">🍽️</div><p style="margin:6px 0 12px">Σύρε μια φωτογραφία εδώ ή</p>
      <div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn primary" data-act="pickImg" data-src="cam">📷 Κάμερα</button><button class="btn" data-act="pickImg" data-src="gal">🖼️ Από συλλογή</button></div></div>`;
  h+=`<label class="f" for="aiDesc">Επιπλέον πληροφορίες (προαιρετικό)</label>
  <textarea id="aiDesc" rows="2" data-input="aidesc" placeholder="π.χ. μαγειρεμένο με 2 κ.σ. ελαιόλαδο, μισή μερίδα ρύζι">${esc(ai.desc)}</textarea>
  <button class="btn primary block lg" style="margin-top:12px" data-act="analyze" ${ai.loading?'disabled':''}>${ai.loading?'Ανάλυση…':'✨ Ανάλυση γεύματος'}</button></section>`;
  if(ai.loading)h+=`<section class="card" style="text-align:center"><div class="spinner"></div><span class="muted">Το Nutri AI αναλύει το γεύμα σου…</span></section>`;
  if(ai.error)h+=`<div class="err mb">⚠️ ${esc(ai.error)}</div>`;
  const R=ai.result;
  if(R){
    if(!R.isFood||!R.items.length){h+=`<section class="card"><p>Δεν αναγνωρίστηκε φαγητό στην εικόνα. ${esc(R.notes)}</p></section>`;return h}
    const tot={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0};
    R.items.forEach(it=>{if(!it.on)return;const v=itemVals(it);NK.forEach(n=>tot[n]+=v[n])});
    h+=`<section class="card"><div class="meal-head"><h3>${esc(R.dish||'Αποτέλεσμα')}</h3><span class="badge ${R.confidence==='high'?'hit':R.confidence==='low'?'miss':'none'}">Βεβαιότητα: ${conf[R.confidence]||R.confidence}</span></div>
    <div class="prev">${NK.map(n=>`<div><b>${r0(tot[n])}</b><span>${NL[n]}${n!=='kcal'?' (g)':''}</span></div>`).join('')}</div>
    ${R.notes?`<div class="note">💡 ${esc(R.notes)}</div>`:''}
    <div class="ai-items" style="margin-top:12px">${R.items.map((it,i)=>{const v=itemVals(it);return`<div class="it ${it.on?'':'off'}">
      <input type="checkbox" ${it.on?'checked':''} data-aion="${i}" aria-label="Συμπερίληψη" style="width:18px;height:18px;accent-color:var(--accent)">
      <input type="text" value="${esc(it.name)}" data-ainame="${i}" aria-label="Όνομα">
      <div class="row" style="gap:4px"><input type="number" min="0" step="5" value="${r0(it.grams)}" data-aigrams="${i}" aria-label="Γραμμάρια"><span class="small muted">g</span></div>
      <small><b>${r0(v.kcal)} kcal</b> · Π ${v.protein} · Υ ${v.carbs} · Λ ${v.fat} · Ίνες ${v.fiber}</small></div>`}).join('')}</div>
    <p class="small muted">Άλλαξε τα γραμμάρια αν η εκτίμηση δεν είναι σωστή — οι τιμές προσαρμόζονται αυτόματα.</p>
    <div class="row"><select data-aimeal>${MEALS.map(([m,n])=>`<option value="${m}" ${ai.meal===m?'selected':''}>${n}</option>`).join('')}</select>
    <button class="btn primary" style="white-space:nowrap" data-act="aiAdd">Προσθήκη σήμερα</button></div></section>`;
  }
  return h;
}
function loadImage(file){
  if(!file)return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const M=1024,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const du=c.toDataURL('image/jpeg',0.85);ai.img=du;ai.b64=du.split(',')[1];ai.result=null;ai.error='';URL.revokeObjectURL(url);render()};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Δεν ήταν δυνατή η ανάγνωση της εικόνας')};
  img.src=url;
}

const CHAT_SUGGEST=['Πώς καταγράφω ένα γεύμα;','Τι είναι το streak και πώς το κρατάω;','Πώς δουλεύει η σάρωση φωτογραφίας;','Πώς υπολογίζονται οι στόχοι μου;','Τι να φάω για να πιάσω την πρωτεΐνη μου σήμερα;','Πώς βάζω την εφαρμογή στο κινητό;'];
function welcomeText(){return`Γεια σου ${firstName()}! 👋 Είμαι ο **Nutri**, ο βοηθός σου στο NutriLog.\n\nΜπορώ να σου εξηγήσω πώς λειτουργεί κάθε κομμάτι της εφαρμογής ή να σε βοηθήσω με ερωτήσεις διατροφής — βλέπω τους στόχους σου και τι έχεις φάει σήμερα.\n\nΔιάλεξε μια ερώτηση παρακάτω ή γράψε τη δική σου.`}
function loadChat(){try{chat.msgs=JSON.parse(localStorage.getItem(chatKey()))||[]}catch(e){chat.msgs=[]}}
function saveChat(){try{localStorage.setItem(chatKey(),JSON.stringify(chat.msgs.slice(-40)))}catch(e){}}
function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',list=false;
  for(const l of lines){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!list){h+='<ul>';list=true}h+=`<li>${m[1]}</li>`;continue}
    if(list){h+='</ul>';list=false}
    if(l.trim())h+=`<p>${l.replace(/^#+\s*/,'')}</p>`}
  return h+(list?'</ul>':'');
}
function renderChat(){
  const log=$('#chatLog');
  log.innerHTML=chat.msgs.map(m=>`<div class="bubble ${m.role}${m.err?' err':''}">${m.role==='user'?esc(m.text):md(m.text)}</div>`).join('')+(chat.busy?'<div class="bubble model typing"><i></i><i></i><i></i></div>':'');
  const asked=chat.msgs.some(m=>m.role==='user');
  $('#chatChips').innerHTML=asked?'':CHAT_SUGGEST.map(q=>`<button class="chip" data-act="chatAsk" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  $('#chatSend').disabled=chat.busy;
  log.scrollTop=log.scrollHeight;
}
function openChat(){if(!chat.msgs.length)chat.msgs.push({role:'model',local:true,text:welcomeText()});renderChat();const d=$('#chatDlg');if(!d.open)d.showModal();
  if(window.matchMedia('(pointer:fine)').matches)$('#chatIn').focus();$('#chatLog').scrollTop=1e9}
async function sendChat(text){
  text=(text||'').trim();if(!text||chat.busy)return;
  chat.msgs.push({role:'user',text});chat.busy=true;renderChat();
  try{
    const hist=chat.msgs.filter(m=>!m.local).slice(-16).map(m=>({role:m.role,text:m.text}));
    const r=await callAI({action:'chat',messages:hist,context:{...aiContext(),tab}});
    chat.msgs.push({role:'model',text:r.text||'…'});
  }catch(e){chat.msgs.push({role:'model',local:true,err:true,text:'⚠️ '+(e.message||'Κάτι πήγε στραβά.')})}
  chat.busy=false;saveChat();renderChat();
}

function recents(){
  const seen=new Set(),out=[];
  for(const k of Object.keys(S.days).sort().reverse()){
    for(const e of [...(S.days[k].entries||[])].reverse()){if(!e.per||seen.has(e.name))continue;seen.add(e.name);out.push({name:e.name,per:e.per,portion:e.grams||100,plabel:'τελευταία φορά',src:'recent'});if(out.length>=8)return out}
  }
  return out;
}
function foodRow(f,i){return`<button class="food-row" data-act="pick" data-i="${i}"><span><b>${esc(f.name)}</b><small>${r0(f.per.kcal)} kcal/100g · Π ${f.per.protein} · Υ ${f.per.carbs} · Λ ${f.per.fat}</small></span>${f.src==='custom'?'⭐':f.src==='recent'?'🕘':''}</button>`}
function resultsHtml(){
  const q=norm(add.q.trim());
  const all=[...S.customFoods.map(f=>({...f,src:'custom'})),...FOODS];
  if(!q){
    const rc=recents();addList=[...rc,...all];
    return(rc.length?`<h5>Πρόσφατα</h5>${rc.map((f,i)=>foodRow(f,i)).join('')}`:'')+`<h5>Όλα τα τρόφιμα</h5>`+all.map((f,i)=>foodRow(f,i+rc.length)).join('');
  }
  const words=q.split(/\s+/);
  addList=all.filter(f=>{const n=norm(f.name);return words.every(w=>n.includes(w))});
  if(!addList.length)return`<p class="muted small" style="padding:10px 4px">Δεν βρέθηκε «${esc(add.q)}». Δοκίμασε τη <button class="link" data-act="addTab" data-t="quick">γρήγορη καταχώρηση</button>, το <button class="link" data-act="addTab" data-t="custom">νέο τρόφιμο</button> ή τη <button class="link" data-act="aiFromAdd">σάρωση με AI</button>.</p>`;
  return addList.map((f,i)=>foodRow(f,i)).join('');
}
function selPrev(){const v=scaled(add.sel.per,+add.grams||0);return NK.map(n=>`<div><b>${r0(v[n])}</b><span>${NL[n]}${n!=='kcal'?' (g)':''}</span></div>`).join('')}
function mealSelect(){return`<select id="mealSel">${MEALS.map(([m,n])=>`<option value="${m}" ${add.meal===m?'selected':''}>${n}</option>`).join('')}</select>`}
function renderAdd(){
  let h=`<div class="sheet-head"><h3>Προσθήκη τροφίμου</h3><button class="icon-btn" data-act="closeDlg" aria-label="Κλείσιμο">✕</button></div>
  <div class="seg">${[['search','Αναζήτηση'],['quick','Γρήγορη'],['custom','Νέο τρόφιμο']].map(([t,l])=>`<button class="${add.tab===t?'on':''}" data-act="addTab" data-t="${t}">${l}</button>`).join('')}</div>`;
  if(add.tab==='search'){
    if(add.sel){const f=add.sel;
      h+=`<div><button class="link" data-act="unpick">‹ Πίσω στη λίστα</button>
        <h3 style="margin:10px 0 2px">${esc(f.name)}</h3><div class="small muted">${r0(f.per.kcal)} kcal ανά 100 g</div>
        <label class="f">Ποσότητα (g)</label><input type="number" id="gramsIn" min="0" step="1" inputmode="decimal" value="${add.grams}" data-input="grams">
        <div class="chips">${f.portion?`<button class="chip" data-act="setG" data-g="${f.portion}">${esc(f.plabel||'μερίδα')} (${f.portion} g)</button><button class="chip" data-act="setG" data-g="${f.portion*2}">2 × (${f.portion*2} g)</button>`:''}<button class="chip" data-act="setG" data-g="100">100 g</button></div>
        <div class="prev" id="selPrev">${selPrev()}</div>
        <label class="f">Γεύμα</label>${mealSelect()}
        <button class="btn primary block lg" style="margin-top:14px" data-act="addSel">Προσθήκη</button></div>`;
    }else h+=`<input type="search" id="q" data-input="q" placeholder="Αναζήτηση… (π.χ. γιαούρτι, ρύζι, σουβλάκι)" value="${esc(add.q)}" autocomplete="off"><div class="results" id="results">${resultsHtml()}</div>`;
  }else if(add.tab==='quick'){
    h+=`<p class="small muted" style="margin:0">Κατέγραψε απευθείας θερμίδες και μακροθρεπτικά (π.χ. από ετικέτα ή εστιατόριο).</p>
      <label class="f">Περιγραφή</label><input type="text" id="qa_name" placeholder="π.χ. Σάντουιτς καφετέριας">
      <div class="form3">${NK.map(n=>`<div><label class="f">${NL[n]} (${NU[n]})</label><input type="number" id="qa_${n}" min="0" step="0.1" inputmode="decimal"></div>`).join('')}</div>
      <label class="f">Γεύμα</label>${mealSelect()}
      <button class="btn primary block lg" style="margin-top:14px" data-act="quickAdd">Προσθήκη</button>`;
  }else{
    h+=`<p class="small muted" style="margin:0">Αποθήκευσε ένα τρόφιμο με τιμές <b>ανά 100 g</b> (από τη συσκευασία) για να το βρίσκεις στην αναζήτηση.</p>
      <label class="f">Όνομα</label><input type="text" id="cf_name" placeholder="π.χ. Μπάρα πρωτεΐνης X">
      <div class="form3">${NK.map(n=>`<div><label class="f">${NL[n]} /100g</label><input type="number" id="cf_${n}" min="0" step="0.1" inputmode="decimal"></div>`).join('')}</div>
      <div class="form2"><div><label class="f">Τυπική μερίδα (g)</label><input type="number" id="cf_portion" min="0" step="1" value="100"></div><div><label class="f">Περιγραφή μερίδας</label><input type="text" id="cf_plabel" placeholder="π.χ. 1 μπάρα"></div></div>
      <button class="btn primary block lg" style="margin-top:14px" data-act="saveCustom">Αποθήκευση & επιλογή</button>`;
  }
  $('#dlgIn').innerHTML=h;
  if(add.tab==='search'&&!add.sel){const q=$('#q');if(q&&window.matchMedia('(pointer:fine)').matches)q.focus()}
}
function openAdd(meal){add={meal,tab:'search',q:'',sel:null,grams:100};renderAdd();const d=$('#dlg');if(!d.open)d.showModal()}
function closeAdd(){$('#dlg').close()}
const numVal=id=>{const v=parseFloat(($('#'+id)||{}).value);return isNaN(v)?0:v};

/* ---------- Ενέργειες ---------- */
const A={
  tab:el=>{tab=el.dataset.tab;render();window.scrollTo(0,0)},
  day:el=>{curDate=addDays(curDate,+el.dataset.d);if(dk(curDate)>todayK())curDate=new Date();render()},
  water:el=>{const d=dayObj(dk(curDate));d.water=Math.max(0,(d.water||0)+(+el.dataset.v));save();render()},
  del:el=>{const d=S.days[dk(curDate)];if(!d)return;const i=d.entries.findIndex(e=>e.id===el.dataset.id);if(i<0)return;const [rm]=d.entries.splice(i,1);save();render();toast(`Διαγράφηκε: ${rm.name}`)},
  openAdd:el=>openAdd(el.dataset.meal),
  closeDlg:closeAdd,
  addTab:el=>{add.tab=el.dataset.t;add.sel=null;renderAdd()},
  pick:el=>{const f=addList[+el.dataset.i];if(!f)return;add.sel=f;add.grams=f.portion||100;renderAdd()},
  unpick:()=>{add.sel=null;renderAdd()},
  setG:el=>{add.grams=+el.dataset.g;$('#gramsIn').value=add.grams;$('#selPrev').innerHTML=selPrev()},
  addSel:()=>{const g=+add.grams;if(!(g>0)){toast('Δώσε ποσότητα σε γραμμάρια');return}
    const f=add.sel;addEntry(dk(curDate),{meal:add.meal,name:f.name,grams:g,per:f.per,...scaled(f.per,g),src:'db'});closeAdd();render();toast(`Προστέθηκε: ${f.name}`)},
  quickAdd:()=>{const name=($('#qa_name').value||'').trim()||'Γρήγορη καταχώρηση',v={};NK.forEach(n=>v[n]=numVal('qa_'+n));
    if(!v.kcal){toast('Συμπλήρωσε τουλάχιστον τις θερμίδες');return}
    addEntry(dk(curDate),{meal:add.meal,name,grams:0,...v,src:'quick'});closeAdd();render();toast(`Προστέθηκε: ${name}`)},
  saveCustom:()=>{const name=($('#cf_name').value||'').trim();if(!name){toast('Δώσε όνομα');return}
    const per={};NK.forEach(n=>per[n]=numVal('cf_'+n));if(!per.kcal){toast('Συμπλήρωσε τις θερμίδες ανά 100g');return}
    const f={name,per,portion:numVal('cf_portion')||100,plabel:($('#cf_plabel').value||'').trim()||'μερίδα'};
    S.customFoods.push(f);save();add.tab='search';add.sel={...f,src:'custom'};add.grams=f.portion;renderAdd();toast('Το τρόφιμο αποθηκεύτηκε')},
  aiFromAdd:()=>{ai.desc=add.q;closeAdd();tab='ai';render()},
  pview:el=>{prog.view=el.dataset.v;render()},
  pnav:el=>{const d=+el.dataset.d,a=prog.anchor;
    if(prog.view==='day')prog.anchor=addDays(a,d);
    else if(prog.view==='week')prog.anchor=addDays(a,7*d);
    else if(prog.view==='month')prog.anchor=new Date(a.getFullYear(),a.getMonth()+d,1);
    else prog.anchor=new Date(a.getFullYear()+d,0,1);
    if(prog.anchor>new Date())prog.anchor=new Date();render()},
  gotoDay:el=>{prog.view='day';prog.anchor=pk(el.dataset.k);render();window.scrollTo(0,0)},
  editDay:el=>{curDate=pk(el.dataset.k);tab='today';render();window.scrollTo(0,0)},
  pickImg:el=>$(el.dataset.src==='cam'?'#fileCam':'#fileGal').click(),
  clearImg:()=>{ai.img=ai.b64=null;ai.result=null;ai.error='';render()},
  analyze,
  aiAdd:()=>{const R=ai.result;if(!R)return;const k=todayK();let n=0;
    R.items.forEach(it=>{if(!it.on||!(it.grams>0))return;const v=itemVals(it);const per={};NK.forEach(x=>per[x]=r1(v[x]/it.grams*100));
      addEntry(k,{meal:ai.meal,name:it.name,grams:it.grams,per,...v,src:'ai'});n++});
    if(!n){toast('Δεν επιλέχθηκε κανένα στοιχείο');return}
    toast(`Προστέθηκαν ${n} στοιχεία στο ${mealName(ai.meal)}`);ai={img:null,b64:null,desc:'',loading:false,error:'',result:null,meal:guessMeal()};curDate=new Date();tab='today';render();window.scrollTo(0,0)},
  reloadModels:()=>{models.err='';loadModels()},
  theme:el=>{S.settings.theme=el.dataset.v;applyTheme(S.settings.theme);save();const y=window.scrollY;render();window.scrollTo(0,y)},
  delCustom:el=>{const f=S.customFoods[+el.dataset.i];if(f&&confirm(`Διαγραφή «${f.name}»;`)){S.customFoods.splice(+el.dataset.i,1);save();render()}},
  export:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`nutrilog-${todayK()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  import:()=>$('#fileImport').click(),
  reset:()=>{if(confirm('Θα διαγραφούν ΟΛΑ τα δεδομένα σου (καταγραφές, στόχοι, τρόφιμα) από όλες τις συσκευές. Συνέχεια;')){S=defState();save();render();openWizard(true)}},
  logout:async()=>{
    if(!DEMO&&syncState!=='ok'){await pushNow();if(syncState!=='ok'&&!confirm('Κάποιες αλλαγές δεν έχουν αποθηκευτεί ακόμα (δεν υπάρχει σύνδεση). Αποσύνδεση ούτως ή άλλως;'))return}
    else if(!confirm('Αποσύνδεση από το NutriLog;'))return;
    try{localStorage.removeItem(cacheKey());localStorage.removeItem(chatKey())}catch(e){}
    if(DEMO){location.reload();return}
    await sb.auth.signOut({scope:'local'});
  },
  // σύνδεση
  google:async()=>{authMsg=null;const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:APP_URL}});if(error){authMsg=['bad',authErr(error)];renderAuth()}},
  authView:el=>{authMsg=null;renderAuth(el.dataset.v)},
  pwToggle:el=>{const i=el.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'},
  // οδηγός
  wizard:()=>openWizard(false),
  wzSet:el=>{wiz.p[el.dataset.f]=el.dataset.f==='activity'?parseFloat(el.dataset.v):el.dataset.v;renderWizard()},
  wzStep:el=>{const f=el.dataset.f,v=r1((+wiz.p[f]||0)+(+el.dataset.d));wiz.p[f]=v;const i=document.querySelector(`[data-wiz="${f}"]`);if(i)i.value=v},
  wzNav:el=>{const d=+el.dataset.d;if(d>0){const e=wizValid();if(e){toast(e);return}}wiz.step=clamp(wiz.step+d,wiz.first?0:1,4);renderWizard();$('#wizIn').scrollTop=0},
  wzDone:()=>{const first=wiz.first;S.profile={...wiz.p,name:(wiz.p.name||'').trim()};S.goals=calcGoals(S.profile).goals;S.onboarded=true;save();$('#wizDlg').close();wiz=null;render();
    toast('Οι στόχοι σου αποθηκεύτηκαν 🎯');if(first)setTimeout(openChat,500)},
  wzSkip:()=>{S.onboarded=true;if(wiz.p.name)S.profile.name=wiz.p.name.trim();save();$('#wizDlg').close();wiz=null;render()},
  wzClose:()=>{$('#wizDlg').close();wiz=null},
  // βοηθός
  chat:openChat,
  closeChat:()=>$('#chatDlg').close(),
  chatAsk:el=>sendChat(el.dataset.q),
  chatNew:()=>{chat.msgs=[{role:'model',local:true,text:welcomeText()}];saveChat();renderChat()}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
['#dlg','#chatDlg'].forEach(s=>$(s).addEventListener('click',e=>{if(e.target===$(s))$(s).close()}));
$('#wizDlg').addEventListener('cancel',e=>{if(wiz&&wiz.first){S.onboarded=true;save()}wiz=null});
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatIn');const t=i.value;i.value='';i.style.height='';sendChat(t)});
$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit()}});
$('#chatIn').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();authSubmit(e.target)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.input==='q'){add.q=el.value;$('#results').innerHTML=resultsHtml();$('#results').scrollTop=0}
  else if(el.dataset.input==='grams'){add.grams=parseFloat(el.value)||0;$('#selPrev').innerHTML=selPrev()}
  else if(el.dataset.input==='aidesc')ai.desc=el.value;
  else if(el.dataset.ainame!==undefined&&ai.result)ai.result.items[+el.dataset.ainame].name=el.value;
  else if(el.dataset.wiz&&wiz){const f=el.dataset.wiz;wiz.p[f]=f==='name'?el.value:parseFloat(el.value)}
  else if(el.dataset.set==='settings.tolerance'){const t=+el.value;$('#tolVal').textContent=`±${t}%`;$('#tolRange').textContent=`Δηλαδή ${r0(S.goals.kcal*(1-t/100))}–${r0(S.goals.kcal*(1+t/100))} kcal την ημέρα`}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.set){
    const [a,b]=el.dataset.set.split('.');let v;
    if(el.type==='checkbox')v=el.checked;
    else if(el.type==='number'||el.type==='range'){v=parseFloat(el.value);if(isNaN(v))return}
    else v=el.value;
    S[a][b]=v;save();
    if(b==='model')toast(v?`Μοντέλο: ${modelLabel(v)}`:'Αυτόματη επιλογή μοντέλου');
    const y=window.scrollY;render();window.scrollTo(0,y);
    return;
  }
  if(el.dataset.weight){const v=parseFloat(String(el.value).replace(',','.'));const d=dayObj(el.dataset.weight);if(isNaN(v))delete d.weight;else d.weight=r1(v);save();toast('Το βάρος αποθηκεύτηκε');return}
  if(el.id==='mealSel'){add.meal=el.value;return}
  if(el.dataset.aimeal!==undefined){ai.meal=el.value;return}
  if(el.dataset.aion!==undefined&&ai.result){ai.result.items[+el.dataset.aion].on=el.checked;render();return}
  if(el.dataset.aigrams!==undefined&&ai.result){ai.result.items[+el.dataset.aigrams].grams=Math.max(0,parseFloat(el.value)||0);const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(el.id==='fileCam'||el.id==='fileGal'){loadImage(el.files[0]);el.value='';return}
  if(el.id==='fileImport'){const file=el.files[0];el.value='';if(!file)return;
    file.text().then(t=>{const j=JSON.parse(t);if(!j||typeof j!=='object'||!j.days)throw new Error('bad');
      if(!confirm('Η εισαγωγή θα αντικαταστήσει τα τρέχοντα δεδομένα σου. Συνέχεια;'))return;
      S=normalize(j);S.onboarded=true;save();applyTheme(S.settings.theme);render();toast('Η εισαγωγή ολοκληρώθηκε')}).catch(()=>toast('Μη έγκυρο αρχείο'))}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='gramsIn')A.addSel();
  if(e.key==='Enter'&&e.target.id==='q'&&addList.length===1){add.sel=addList[0];add.grams=addList[0].portion||100;renderAdd()}
});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('drag')}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z)z.classList.remove('drag')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(!z)return;e.preventDefault();z.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImage(f)});

boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
