const CHAT_SUGGEST=['Έφαγα 2 αυγά και ένα τοστ για πρωινό','Τι να φάω για να πιάσω την πρωτεΐνη μου;','Πώς σκανάρω την ετικέτα μιας συσκευασίας;','Σε τι βοηθούν οι φυτικές ίνες;','Τι είναι το streak και το πάγωμα;','Πώς υπολογίζονται οι στόχοι μου;','Πώς βάζω υπενθυμίσεις;'];
function welcomeText(){return`Γεια σου ${firstName()}! 👋 Είμαι ο **Nutri**, ο βοηθός σου στο NutriLog.\n\nΜπορώ να:\n- σου εξηγήσω πώς λειτουργεί κάθε κομμάτι της εφαρμογής\n- **καταγράψω φαγητό** για σένα — απλώς γράψε μου τι έφαγες\n- σε βοηθήσω με ερωτήσεις διατροφής, αφού βλέπω τους στόχους σου και τι έχεις φάει σήμερα\n\nΔιάλεξε κάτι παρακάτω ή γράψε τη δική σου ερώτηση.`}
function loadChat(){try{chat.msgs=JSON.parse(localStorage.getItem(chatKey()))||[]}catch(e){chat.msgs=[]}}
function saveChat(){try{localStorage.setItem(chatKey(),JSON.stringify(chat.msgs.slice(-40)))}catch(e){}}
function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',list=false;
  for(const l of lines){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!list){h+='<ul>';list=true}h+=`<li>${m[1]}</li>`;continue}
    if(list){h+='</ul>';list=false}
    if(l.trim())h+=`<p>${l.replace(/^#+\s*/,'')}</p>`}
  return h+(list?'</ul>':'');
}
function actionCard(m,mi,ai_){
  const a=m.actions[ai_],items=a.items||[],tot=sugTotals(items);
  if(a.done)return`<div class="act-card"><div class="small" style="color:var(--accent-text);font-weight:700">${a.done==='added'?`✓ Προστέθηκε στο ${mealName(a.meal)} ${a.day==='yesterday'?'(χθες)':''}`:'Ακυρώθηκε'}</div></div>`;
  return`<div class="act-card"><div class="small muted" style="font-weight:700;margin-bottom:4px">📝 Καταγραφή ${a.day==='yesterday'?'για χθες':'για σήμερα'}</div>
    ${items.map(it=>`<div class="ln"><span>${esc(it.name)} <span class="muted">${r0(it.grams)} g</span></span><b>${r0(it.kcal)}</b></div>`).join('')}
    <div class="ln tot"><span>Σύνολο · Π ${r0(tot.protein)} · Υ ${r0(tot.carbs)} · Λ ${r0(tot.fat)}</span><span>${r0(tot.kcal)} kcal</span></div>
    <select data-actmeal="${mi}:${ai_}" aria-label="Γεύμα">${MEALS.map(([v,n])=>`<option value="${v}" ${a.meal===v?'selected':''}>${n}</option>`).join('')}</select>
    <div class="row" style="margin-top:8px"><button class="btn primary sm" style="flex:1" data-act="actAdd" data-k="${mi}:${ai_}">Προσθήκη</button><button class="btn sm" data-act="actCancel" data-k="${mi}:${ai_}">Όχι</button></div></div>`;
}
function renderChat(){
  const log=$('#chatLog');
  log.innerHTML=chat.msgs.map((m,mi)=>`<div class="bubble ${m.role}${m.err?' err':''}">${m.role==='user'?esc(m.text):md(m.text)}</div>`+((m.actions||[]).map((_,ai_)=>actionCard(m,mi,ai_)).join(''))).join('')+(chat.busy?'<div class="bubble model typing"><i></i><i></i><i></i></div>':'');
  const asked=chat.msgs.some(m=>m.role==='user');
  $('#chatChips').innerHTML=asked?'':'<button class="chip" data-act="suggest">💡 Τι να φάω τώρα;</button>'+CHAT_SUGGEST.map(q=>`<button class="chip" data-act="chatAsk" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  $('#chatSend').disabled=chat.busy;

function openChat(){if(!chat.msgs.length)chat.msgs.push({role:'model',local:true,text:welcomeText()});renderChat();const d=$('#chatDlg');if(!d.open)d.showModal();
  if(window.matchMedia('(pointer:fine)').matches)$('#chatIn').focus();$('#chatLog').scrollTop=1e9}
async function sendChat(text){
  text=(text||'').trim();if(!text||chat.busy)return;
  chat.msgs.push({role:'user',text});chat.busy=true;renderChat();
  try{
    const hist=chat.msgs.filter(m=>!m.local).slice(-16).map(m=>({role:m.role,text:m.text}));
    const r=await callAI({action:'chat',messages:hist,context:{...aiContext(),tab}});
    chat.msgs.push({role:'model',text:r.text||'…',actions:(r.actions||[]).map(a=>({...a,done:null}))});
  }catch(e){chat.msgs.push({role:'model',local:true,err:true,text:'⚠️ '+(e.message||'Κάτι πήγε στραβά.')})}
  chat.busy=false;saveChat();renderChat();
}

function recents(){
  const seen=new Set(),out=[];
  for(const k of Object.keys(S.days).sort().reverse()){
    for(const e of [...(S.days[k].entries||[])].reverse()){if(!e.per||seen.has(e.name))continue;seen.add(e.name);
      out.push({name:e.name,per:e.per,portion:e.grams||100,plabel:'τελευταία φορά',src:'recent',osrc:e.src,last:{grams:e.grams,vals:Object.fromEntries(ALLK.filter(n=>e[n]!=null).map(n=>[n,e[n]]))}});if(out.length>=8)return out}
  }
  return out;
}
const NS_COL={a:'#038141',b:'#85bb2f',c:'#e5b700',d:'#ee8100',e:'#e63e11'};
const nsBadge=g=>g?`<span class="ns" style="background:${NS_COL[g]}" title="Nutri-Score ${g.toUpperCase()}">${g.toUpperCase()}</span>`:'';
function foodRow(f,i){const tag={custom:f.label?'🧾':'⭐',recent:'🕘',off:'🏷️',barcode:'🏷️'}[f.src]||'';
  const row=`<button class="food-row" data-act="pick" data-i="${i}"><span><b>${esc(f.name)}</b><small>${f.src==='recent'?`${r0(f.last.vals.kcal)} kcal · ${r0(f.portion)} g την τελευταία φορά`:`${r0(f.per.kcal)} kcal/100g · Π ${f.per.protein} · Υ ${f.per.carbs} · Λ ${f.per.fat}`}</small></span>${tag}</button>`;
  return f.src==='recent'?`<div class="fr">${row}<button class="qadd" data-act="quickPick" data-i="${i}" aria-label="Προσθήκη ${esc(f.name)} με την ίδια ποσότητα" title="Ίδια ποσότητα με την τελευταία φορά">+</button></div>`:row}
function resultsHtml(){
  const q=norm(add.q.trim());
  const all=[...S.customFoods.map(f=>({...f,src:'custom'})),...FOODS];
  let h='';
  if(!q){
    const rc=recents();addList=[...rc,...all];
    return(rc.length?`<h5>Πρόσφατα · πάτα + για ίδια ποσότητα</h5>${rc.map((f,i)=>foodRow(f,i)).join('')}`:'')+`<h5>Όλα τα τρόφιμα</h5>`+all.map((f,i)=>foodRow(f,i+rc.length)).join('');
  }
  const words=q.split(/\s+/);
  const local=all.filter(f=>{const n=norm(f.name);return words.every(w=>n.includes(w))});
  const offItems=add.off&&add.off.q===add.q.trim()?add.off.items:[];
  addList=[...local,...offItems];
  h+=local.map((f,i)=>foodRow(f,i)).join('');

    else h+=offItems.map((f,i)=>foodRow(f,i+local.length)).join('');
  }else h+=`<button class="btn block" style="margin:6px 0" data-act="offSearch">🔎 Ψάξε «${esc(add.q.trim())}» σε εκατομμύρια προϊόντα</button>`;

  return h;

  else if(el.dataset.input==='aidesc')ai.desc=el.value;
  else if(el.dataset.lb&&ai.label){const [s,k]=el.dataset.lb.split('.'),o=s==='p'?ai.label.p:ai.label.srv.v,v=parseFloat(String(el.value).replace(',','.'));o[k]=isNaN(v)?null:v;refreshLabel()}
  else if(el.dataset.lbname!==undefined&&ai.label)ai.label.product=el.value;
  else if(el.dataset.lbg!==undefined&&ai.label){ai.label.g=parseFloat(el.value)||0;refreshLabel()}
  else if(el.dataset.lbcode!==undefined&&ai.label)ai.label.code=el.value;
  else if(el.dataset.edq!==undefined&&ed){ed.q=parseFloat(el.value)||0;refreshEntry()}
  else if(el.dataset.edname!==undefined&&ed)ed.name=el.value;
  else if(el.dataset.ainame!==undefined&&ai.result)ai.result.items[+el.dataset.ainame].name=el.value;
  else if(el.dataset.pe&&pe&&el.tagName==='INPUT'){const f=el.dataset.pe;pe.p[f]=f==='name'?el.value:(el.value===''?null:parseFloat(el.value))}
  else if(el.dataset.wiz&&wiz){const f=el.dataset.wiz;wiz.p[f]=f==='name'?el.value:parseFloat(el.value)}
  else if(el.dataset.set==='settings.tolerance'){const t=+el.value;$('#tolVal').textContent=`±${t}%`;$('#tolRange').textContent=`Δηλαδή ${r0(S.goals.kcal*(1-t/100))}–${r0(S.goals.kcal*(1+t/100))} kcal την ημέρα`}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.set){
    const [a,b]=el.dataset.set.split('.');let v;
    if(el.type==='checkbox')v=el.checked;
    else if(el.type==='number'||el.type==='range'){v=parseFloat(el.value);if(isNaN(v))return}
    else v=el.value;
    S[a][b]=v;save();
    if(b==='model')toast(v?`Μοντέλο: ${modelLabel(v)}`:'Αυτόματη επιλογή μοντέλου');
    const y=window.scrollY;render();window.scrollTo(0,y);
    return;
  }
  if(el.dataset.actChange==='remToggle'){
    const r=S.settings.reminders;
    if(el.checked){el.disabled=true;
      try{if(await ensurePushSub(true)){r.enabled=true;save();await syncRemPrefs();toast('🔔 Οι υπενθυμίσεις ενεργοποιήθηκαν')}else{toast('Δεν δόθηκε άδεια για ειδοποιήσεις');}}
      catch(err){toast('⚠️ '+(err.message||'Δεν ήταν δυνατή η ενεργοποίηση'))}}
    else{r.enabled=false;save();await syncRemPrefs();toast('Οι υπενθυμίσεις απενεργοποιήθηκαν')}
    const y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(el.dataset.rem){const r=S.settings.reminders,k=el.dataset.rem;r[k]=el.type==='checkbox'?el.checked:el.value;save();syncRemPrefs();
    if(el.type==='checkbox'){const y=window.scrollY;render();window.scrollTo(0,y)}return}
  if(el.dataset.weight){const v=parseFloat(String(el.value).replace(',','.'));const d=dayObj(el.dataset.weight);if(isNaN(v))delete d.weight;else{d.weight=r1(v);if(el.dataset.weight===todayK()&&v>=30&&v<=300)S.profile.weight=r1(v)}save();toast('Το βάρος αποθηκεύτηκε');if(tab==='progress'){const y=window.scrollY;render();window.scrollTo(0,y)}return}
  if(el.dataset.wizagree!==undefined&&wiz){wiz.agree=el.checked;return}
  if(el.dataset.actmeal){const [mi,ai_]=el.dataset.actmeal.split(':').map(Number);const a=chat.msgs[mi]&&chat.msgs[mi].actions[ai_];if(a){a.meal=el.value;saveChat()}return}
  if(el.id==='mealSel'){add.meal=el.value;return}
  if(el.dataset.aimeal!==undefined){ai.meal=el.value;return}
  if(el.dataset.aion!==undefined&&ai.result){ai.result.items[+el.dataset.aion].on=el.checked;renderScan();return}
  if(el.dataset.aigrams!==undefined&&ai.result){ai.result.items[+el.dataset.aigrams].grams=Math.max(0,parseFloat(el.value)||0);renderScan();return}
  if(el.dataset.lbsave!==undefined&&ai.label){ai.label.save=el.checked;return}
  if(el.dataset.edmeal!==undefined&&ed){ed.meal=el.value;return}
  if(el.id==='fileCam'||el.id==='fileGal'){loadImage(el.files[0]);el.value='';return}
  if(el.id==='fileAvatar'){processAvatar(el.files[0]);el.value='';return}
  if(el.dataset.pe&&pe&&el.tagName==='SELECT'){pe.p[el.dataset.pe]=el.value;return}
  if(el.dataset.peRecalc!==undefined&&pe){pe.recalc=el.checked;return}
  if(el.id==='fileBarcode'){const file=el.files[0];el.value='';if(!file)return;
    try{await loadScript(QR_LIB);stopScanner();const tmp=new window.Html5Qrcode('reader',false);const code=await tmp.scanFile(file,false);tmp.clear();onBarcode(code)}
    catch(err){toast('Δεν βρέθηκε barcode στη φωτογραφία. Δοκίμασε πιο καθαρή λήψη.')}return}
  if(el.id==='fileImport'){const file=el.files[0];el.value='';if(!file)return;
    file.text().then(t=>{const j=JSON.parse(t);if(!j||typeof j!=='object'||!j.days)throw new Error('bad');
      if(!confirm('Η εισαγωγή θα αντικαταστήσει τα τρέχοντα δεδομένα σου. Συνέχεια;'))return;
      const c=S.consent;S=normalize(j);S.onboarded=true;S.consent=S.consent||c;save();applyTheme(S.settings.theme);render();toast('Η εισαγωγή ολοκληρώθηκε')}).catch(()=>toast('Μη έγκυρο αρχείο'))}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='gramsIn')A.addSel();
  if(e.key==='Enter'&&e.target.id==='codeIn')A.codeGo();
  if(e.key==='Enter'&&e.target.id==='q'){if(addList.length===1){add.sel=addList[0];add.grams=addList[0].portion||100;renderAdd()}else if(add.q.trim().length>=2&&!(add.off&&add.off.q===add.q.trim()))offSearch()}
});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('drag')}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z)z.classList.remove('drag')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(!z)return;e.preventDefault();z.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImage(f)});

boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
