<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriLog</title>
<meta name="theme-color" content="#2f9e5b">
<meta name="description" content="NutriLog: καταγραφή θερμίδων και μακροθρεπτικών, σάρωση barcode, AI ανάλυση γευμάτων από φωτογραφία, streak και πρόοδος.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutriLog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6f1;--bg-tint:#e3f1e6;--card:#ffffff;--card2:#f1f5f0;--text:#13201a;--muted:#67736c;--border:#e3e9e2;
  --accent:#1fa35c;--accent2:#0e7a4c;--accent-soft:#dff3e6;--accent-text:#13743f;
  --hero:linear-gradient(140deg,#27b46c 0%,#14905b 55%,#0d6f56 100%);
  --warn:#e8902a;--warn-soft:#fdeedb;--danger:#dc4a4a;--danger-soft:#fde5e5;--none:#e5eae4;
  --ice:#3f9ae0;--ice-soft:#dcecfa;
  --protein:#3b82f6;--carbs:#f2a516;--fat:#e0508f;--fiber:#10a37f;--sugar:#9b5de5;--water:#0ea5e9;
  --shadow:0 1px 2px rgba(17,45,28,.04),0 8px 24px rgba(17,45,28,.06);
  --shadow-lg:0 12px 40px rgba(17,45,28,.14);
  --radius:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c110f;--bg-tint:#112018;--card:#151c18;--card2:#1c2520;--text:#e9efeb;--muted:#93a099;--border:#232d28;
    --accent:#34c477;--accent2:#1f9a5c;--accent-soft:#173326;--accent-text:#7fe0a8;
    --hero:linear-gradient(140deg,#1f9c5c 0%,#137a4c 55%,#0d5a43 100%);
    --warn:#f2a447;--warn-soft:#3a2c17;--danger:#f06a6a;--danger-soft:#3d1f1f;--none:#252f2a;
    --ice:#6cb4ee;--ice-soft:#1b3044;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.18);--shadow-lg:0 12px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0c110f;--bg-tint:#112018;--card:#151c18;--card2:#1c2520;--text:#e9efeb;--muted:#93a099;--border:#232d28;
  --accent:#34c477;--accent2:#1f9a5c;--accent-soft:#173326;--accent-text:#7fe0a8;
  --hero:linear-gradient(140deg,#1f9c5c 0%,#137a4c 55%,#0d5a43 100%);
  --warn:#f2a447;--warn-soft:#3a2c17;--danger:#f06a6a;--danger-soft:#3d1f1f;--none:#252f2a;
  --ice:#6cb4ee;--ice-soft:#1b3044;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.18);--shadow-lg:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 380px at 50% -120px,var(--bg-tint),transparent 70%) no-repeat,var(--bg);color:var(--text);
  font:15px/1.5 'Manrope',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  /* Χωρίς επιλογή κειμένου: αποτρέπει το «Touch to Search» / αναζήτηση Google στο κινητό */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body.in-app{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:750}
.num,.ring-txt b,.stat b,.goal-hero b,.sc b,.avg b,.mini b,.water-val b,.big{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top .in{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:760px;margin:0 auto}
.brand{font-weight:800;font-size:19px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:10px;background:var(--hero);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px;font-weight:800;box-shadow:0 4px 12px rgba(20,144,91,.35)}
.top-r{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:var(--card);color:var(--warn);font-weight:800;font-size:14px;box-shadow:var(--shadow)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sync.saving,.sync.pending{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);animation:pulse 1s ease-in-out infinite}
.sync.offline,.sync.error{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--card);background:var(--accent-soft);color:var(--accent-text);font-weight:800;overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
main{max-width:760px;margin:0 auto;padding:4px 16px 24px}

/* base */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-.015em}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin-bottom:0}
.mb{margin-bottom:14px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.sec-title span{font-size:13px;color:var(--muted);font-weight:650}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:19px;display:grid;place-items:center;flex:none;color:var(--text);box-shadow:var(--shadow);transition:transform .1s}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:11px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s;color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--hero);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(20,144,91,.28)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent}
.btn.block{width:100%}
.btn.lg{padding:14px 18px;font-size:16px;border-radius:16px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent-text);cursor:pointer;padding:0;font-weight:700}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=search],input[type=time],select,textarea{width:100%;border:1.5px solid var(--border);background:var(--card2);border-radius:14px;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--card)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.greet{font-size:26px;font-weight:800;letter-spacing:-.035em;margin:10px 0 0;line-height:1.2}
.greet-sub{color:var(--muted);font-size:14px;margin:2px 0 12px;font-weight:600}

/* date bar */
.datebar{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.date-title{flex:1;text-align:center;display:flex;flex-direction:column}
.date-title strong{font-size:16px;font-weight:800}
.date-title span{font-size:13px;color:var(--muted);font-weight:600}

/* hero */
.hero{display:flex;gap:20px;align-items:center;background:var(--hero);color:#fff;border:0;box-shadow:0 14px 34px rgba(20,120,80,.32);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.hero::after{content:"";position:absolute;width:200px;height:200px;left:-70px;bottom:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 65%)}
.ring{position:relative;width:156px;height:156px;flex:none;z-index:1}
.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:13}
.ring-fg{fill:none;stroke:#fff;stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.3,.8,.3,1);filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.ring-fg.over{stroke:#ffd0c4}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-size:32px;letter-spacing:-.04em;line-height:1;font-weight:800}
.ring-txt span{font-size:12px;opacity:.85;margin-top:5px;font-weight:600}
.hero-side{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;z-index:1}
.stat span{display:block;font-size:11.5px;opacity:.8;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:24px;letter-spacing:-.03em}
.stat b.neg{color:#ffd0c4}
.hero span.badge{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:750;align-self:flex-start;white-space:nowrap}
.badge.hit{background:var(--accent-soft);color:var(--accent-text)}
.badge.miss{background:var(--warn-soft);color:var(--warn)}
.badge.none{background:var(--none);color:var(--muted)}
.badge.freeze{background:var(--ice-soft);color:var(--ice)}

/* macros */
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mini{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow)}
.mini .mr{position:relative;width:64px;height:64px;margin:0 auto 8px}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini .mr span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.mini b{display:block;font-size:15px;letter-spacing:-.02em}
.mini small{display:block;color:var(--muted);font-size:12px;font-weight:650}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.mbar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}
.mbar .lbl b{font-weight:750}
.mbar .lbl span{color:var(--muted);white-space:nowrap;font-weight:600}
.track{height:9px;background:var(--none);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;letter-spacing:-.015em}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"›";transform:rotate(90deg);transition:.2s;color:var(--muted);font-size:22px}
details.card[open]>summary::after{transform:rotate(-90deg)}
details.card[open]>summary{margin-bottom:14px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa button{border:1px solid var(--border);background:var(--card);border-radius:20px;padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:750;color:var(--text);box-shadow:var(--shadow);transition:transform .1s;line-height:1.2}
.qa button:active{transform:scale(.96)}
.qa .qi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}

/* water */
.water{background:linear-gradient(150deg,color-mix(in srgb,var(--water) 14%,var(--card)),var(--card) 70%)}
.water-row{display:flex;align-items:center;gap:10px}
.water-val{flex:1;text-align:center}
.water-val b{font-size:24px;letter-spacing:-.03em}
.drops{display:flex;gap:4px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.drop{width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--none);transition:background .3s}
.drop.on{background:var(--water)}

/* meals */
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.meal-head h3{margin:0;display:flex;align-items:center;gap:10px}
.meal-head .kc{color:var(--muted);font-size:14px;font-weight:700}
.mh{display:flex;align-items:center;gap:12px}
.mh .mi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.mh .mt{flex:1;min-width:0}
.mh .mt b{display:block;font-size:16px;letter-spacing:-.015em}
.mh .mt small{color:var(--muted);font-weight:650;font-size:13px}
.plus{width:40px;height:40px;border-radius:14px;border:0;background:var(--accent-soft);color:var(--accent-text);font-size:24px;font-weight:600;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .1s}
.plus:active{transform:scale(.92)}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.mh+.entry{margin-top:12px}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .nm small{color:var(--muted);font-size:12.5px;font-weight:600}
.entry .kc{font-weight:800;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;width:30px;height:30px;border-radius:9px;flex:none}
.del:hover{background:var(--danger-soft);color:var(--danger)}
.meal-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add-btn{flex:1;border:1.5px dashed var(--border);background:transparent;border-radius:14px;padding:11px;cursor:pointer;color:var(--accent-text);font-weight:700;margin-top:12px;width:100%}
.add-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.mini-btn{border:1px solid var(--border);background:var(--card2);border-radius:99px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--text)}
.mini-btn:hover{border-color:var(--accent)}
.ai-tag{font-size:10.5px;background:var(--accent-soft);color:var(--accent-text);padding:1px 6px;border-radius:6px;margin-left:5px;font-weight:800;vertical-align:1px}
.tip{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.tip.ice{background:linear-gradient(135deg,var(--ice-soft),var(--card) 80%)}
.tip .e{font-size:22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);flex:none}
.tip.ice .e{background:var(--card)}
.tip div{flex:1;font-size:14px}

/* segmented */
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* streak cards & achievements */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.sc .e{font-size:20px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin:0 auto 6px;background:var(--card2)}
.sc b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.sc span{font-size:12px;color:var(--muted);font-weight:650}
.sc.fire{background:linear-gradient(160deg,var(--warn-soft),var(--card) 75%)}
.sc.fire .e{background:var(--card)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ach div{text-align:center;padding:12px 6px;border-radius:18px;background:var(--card2);border:1px solid var(--border)}
.ach div .e{font-size:30px;display:block}
.ach div b{display:block;font-size:12.5px;line-height:1.2;margin-top:4px}
.ach div small{display:block;font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px;font-weight:600}
.ach div.locked{opacity:.38;filter:grayscale(1)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:750;padding-bottom:2px}
.cell{aspect-ratio:1/1;border-radius:13px;background:var(--none);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;min-width:0;color:var(--text);font-family:inherit}
.cell .dn{font-weight:800;font-size:14px}
.cell .dk{font-size:10px;opacity:.85;white-space:nowrap;font-weight:650}
.cell.hit{background:var(--accent);color:#fff}
.cell.miss{background:var(--warn-soft);color:var(--warn)}
.cell.freeze{background:var(--ice-soft);color:var(--ice)}
.cell.today{outline:2px solid var(--text);outline-offset:1px}
.cell.future{opacity:.4;cursor:default}
.cell.empty{background:transparent;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px;font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.heat i{border-radius:3px;background:var(--none)}
.heat i.hit{background:var(--accent)}
.heat i.miss{background:var(--warn)}
.heat i.freeze{background:var(--ice)}
.heat i.blank{background:transparent}
.heat i.future{opacity:.35}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .bar.hit{fill:var(--accent)}
.chart .bar.miss{fill:var(--warn)}
.chart .bar.freeze{fill:var(--ice)}
.chart .bar.none{fill:var(--none)}
.chart .gl{stroke:var(--text);stroke-dasharray:5 5;opacity:.4}
.chart .grid{stroke:var(--border)}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit;font-weight:600}
.chart text.v{fill:var(--text);font-weight:800}
.chart .ln{fill:none;stroke:var(--protein);stroke-width:2.5;stroke-linejoin:round}
.chart .pt{fill:var(--protein)}
.avg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avg{background:var(--card2);border-radius:16px;padding:11px 12px}
.avg span{display:block;font-size:12px;color:var(--muted);font-weight:650}
.avg b{font-size:18px;letter-spacing:-.02em}
.avg small{color:var(--muted)}
.period-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.period-nav div{flex:1;text-align:center;font-weight:800}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt td,table.nt th{padding:9px 4px;border-top:1px solid var(--border);text-align:right}
table.nt th{font-size:12px;color:var(--muted);font-weight:750;border-top:0}
table.nt td:first-child,table.nt th:first-child{text-align:left}
table.nt tr.sep td{background:var(--card2);font-size:12px;font-weight:800;color:var(--muted)}

/* review */
.score{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.score .num{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--none) 0);position:relative;flex:none}
.score .num::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.score .num span{position:relative}
.rv ul{margin:6px 0 10px;padding-left:20px}
.rv li{margin:3px 0}
.rv h4{margin:12px 0 2px;font-size:14px}

/* AI scan */
.drop-zone{border:2px dashed var(--border);border-radius:20px;padding:26px;text-align:center;background:var(--card2);transition:.2s}
.drop-zone.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone .big{font-size:42px}
.preview{width:100%;max-height:340px;object-fit:cover;border-radius:18px;display:block}
.ai-items .it{display:grid;grid-template-columns:24px 1fr 86px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.ai-items .it input[type=text]{padding:7px 9px;font-weight:700}
.ai-items .it input[type=number]{padding:7px 9px;text-align:right}
.ai-items .it small{grid-column:2/4;color:var(--muted);font-size:12.5px;margin-top:-4px;font-weight:600}
.ai-items .it.off{opacity:.45}
.note{background:var(--accent-soft);color:var(--accent-text);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600}
.err{background:var(--danger-soft);color:var(--danger);border-radius:16px;padding:12px 14px;font-size:14px;word-break:break-word;font-weight:600}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--none);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 10px}
.spinner.sm{width:20px;height:20px;border-width:3px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* suggestions */
.sug{border:1px solid var(--border);border-radius:20px;padding:14px;margin-top:10px;background:var(--card2)}
.sug b.t{font-size:15px}
.sug p{margin:4px 0 8px;font-size:13.5px;color:var(--muted);font-weight:600}
.sug ul{margin:0 0 10px;padding-left:18px;font-size:13.5px}
.sug .row{justify-content:space-between}

/* scanner */
.scanbox{border-radius:20px;overflow:hidden;background:#000;min-height:220px;position:relative}
.scanbox video{width:100%!important;display:block}
#reader{width:100%}
#reader img[alt="Info icon"],#reader__dashboard_section_csr span{display:none!important}

/* floating tab bar + fab */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10;pointer-events:none}
.tabbar .in{display:flex;width:100%;max-width:520px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border:1px solid var(--border);border-radius:26px;padding:6px;box-shadow:var(--shadow-lg);pointer-events:auto}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:750;border-radius:20px;transition:color .2s,background .2s}
.tabbar button .ic{display:grid;place-items:center;height:26px}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--accent-text);background:var(--accent-soft)}
.fab{position:fixed;right:max(18px,calc(50vw - 360px));bottom:calc(92px + env(safe-area-inset-bottom));height:54px;padding:0 20px 0 16px;border-radius:20px;border:0;background:var(--hero);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(14,122,76,.4);cursor:pointer;z-index:9;transition:transform .15s}
.fab:active{transform:scale(.95)}
.fab span{font-size:20px}

/* dialogs */
dialog.sheet{border:0;padding:0;background:var(--card);color:var(--text);border-radius:28px;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 30px);box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog.sheet::backdrop{background:rgba(8,14,11,.5);backdrop-filter:blur(3px)}
dialog.sheet[open]{animation:sheetIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}}
.sheet-in{padding:18px;display:flex;flex-direction:column;max-height:calc(100dvh - 30px)}
.sheet-scroll{overflow-y:auto;margin:0 -18px;padding:0 18px}
dialog.tall .sheet-in{height:min(720px,calc(100dvh - 30px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.results{overflow-y:auto;max-height:50vh;margin-top:10px;margin-right:-6px;padding-right:6px}
.results h5{margin:12px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}
.food-row{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--border);padding:11px 6px;cursor:pointer;border-radius:10px;color:var(--text)}
.food-row:hover{background:var(--card2)}
.food-row span{flex:1;min-width:0}
.food-row b{display:block;font-weight:700}
.food-row small{color:var(--muted);font-size:12.5px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chip{border:1px solid var(--border);background:var(--card2);border-radius:99px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;color:var(--text)}
.chip:hover{border-color:var(--accent)}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.prev div{background:var(--card2);border-radius:14px;padding:9px;text-align:center}
.prev b{display:block;font-size:18px;letter-spacing:-.02em}
.prev span{font-size:11.5px;color:var(--muted);font-weight:650}
.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.custom-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--border)}
.info{background:var(--card2);border-radius:16px;padding:11px 13px;font-size:13.5px;margin-top:12px;font-weight:600}
a{color:var(--accent-text)}

/* profile */
.acct{display:flex;align-items:center;gap:14px}
.acct .avatar{width:62px;height:62px;font-size:24px;cursor:default}
.goal-hero{display:flex;align-items:baseline;gap:6px}
.goal-hero b{font-size:38px;letter-spacing:-.04em;line-height:1.1}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gchip{padding:7px 11px;border-radius:12px;background:var(--card2);font-size:13px;font-weight:750}
.gchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.setrow.first{border-top:0;padding-top:0}
.setrow .t{min-width:0;flex:1}
.setrow .t b{display:block;font-weight:750}
.setrow .t small{color:var(--muted);font-size:12.5px;font-weight:600}
.setrow input[type=time]{width:auto;padding:8px 10px}
.switch{position:relative;width:50px;height:30px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--none);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{box-shadow:0 0 0 3px var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0}
details.acc{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
details.acc summary{cursor:pointer;font-weight:750;color:var(--accent-text);list-style:none;padding:4px 0}
details.acc summary::-webkit-details-marker{display:none}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.legal{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;margin:6px 0 14px;font-weight:650}

/* wizard */
.wz-hero{font-size:46px;text-align:center;margin-top:6px}
.wz h2{margin:6px 0 4px;font-size:22px;letter-spacing:-.03em;text-align:center;font-weight:800}
.wz>p{text-align:center;margin:0 0 8px;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--none);transition:.25s}
.dots i.on{width:24px;background:var(--accent)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--border);border-radius:18px;background:var(--card);cursor:pointer;margin-bottom:8px;color:var(--text);transition:border-color .15s,background .15s}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{font-size:24px;width:34px;text-align:center}
.opt b{display:block}
.opt small{color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:14px;background:var(--card2);overflow:hidden}
.stepper button{width:36px;height:46px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--accent-text);flex:none;font-weight:700}
.stepper input{border:0!important;background:none!important;text-align:center;padding:8px 0!important;border-radius:0!important;font-weight:800;box-shadow:none!important;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.wz-foot{display:flex;gap:10px;margin-top:16px}
.wz-foot .btn{flex:1}
.wz-body{overflow-y:auto;margin:0 -4px;padding:0 4px}
.consent{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:16px;padding:13px;margin-top:14px;font-size:13.5px;cursor:pointer;font-weight:600}
.consent input{width:20px;height:20px;flex:none;accent-color:var(--accent);margin-top:1px}

/* chat */
.bot-h{display:flex;align-items:center;gap:10px}
.bot-av{width:40px;height:40px;border-radius:14px;background:var(--hero);color:#fff;display:grid;place-items:center;font-size:19px;flex:none;box-shadow:0 4px 12px rgba(20,144,91,.3)}
.bot-h h3{margin:0;font-size:16px}
.bot-h small{font-size:12px;font-weight:600}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;min-height:200px}
.bubble{max-width:88%;padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.55;word-wrap:break-word}
.bubble.user{align-self:flex-end;background:var(--hero);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.bubble.model{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bubble.err{background:var(--danger-soft);color:var(--danger)}
.bubble p{margin:0 0 7px}.bubble p:last-child{margin:0}
.bubble ul{margin:4px 0 7px;padding-left:20px}.bubble li{margin:2px 0}
.act-card{align-self:flex-start;max-width:88%;width:100%;border:1.5px solid var(--accent);border-radius:20px;padding:13px;background:var(--card)}
.act-card .ln{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0}
.act-card .tot{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;font-weight:800}
.act-card select{padding:8px 10px;margin-top:8px}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.chat-form{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);align-items:flex-end}
.chat-form textarea{resize:none;max-height:120px;border-radius:18px}
.chat-form .btn{height:46px;width:50px;padding:0;flex:none;font-size:18px;border-radius:16px}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(8,14,11,.5);backdrop-filter:blur(4px);padding:20px;animation:fade .25s}
.cel-card{background:var(--card);border-radius:28px;padding:28px 22px;text-align:center;max-width:340px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.cel-card .e{font-size:64px;line-height:1}
.cel-card b{display:block;font-size:21px;margin:12px 0 4px;letter-spacing:-.03em}
.cel-card p{margin:0 0 18px;color:var(--muted);font-weight:600}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes fade{from{opacity:0}}
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:250}

/* auth */
.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:28px 16px;position:relative;overflow:hidden;
  background:radial-gradient(520px 420px at 12% 8%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),
             radial-gradient(480px 380px at 92% 22%,color-mix(in srgb,var(--water) 16%,transparent),transparent 70%),
             radial-gradient(520px 420px at 70% 105%,color-mix(in srgb,var(--carbs) 14%,transparent),transparent 70%),var(--bg)}
.auth-card{width:100%;max-width:420px;position:relative}
.auth-top{text-align:center;margin-bottom:22px}
.auth-top .logo{width:68px;height:68px;border-radius:22px;font-size:32px;margin:0 auto 14px;box-shadow:0 14px 34px rgba(20,144,91,.38)}
.auth-top h1{margin:0;font-size:32px;letter-spacing:-.045em;font-weight:800}
.auth-top p{margin:8px 0 0;color:var(--muted);font-weight:600}
.feat{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.feat span{font-size:12.5px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--border);padding:6px 11px;border-radius:99px;font-weight:700;backdrop-filter:blur(6px)}
.auth-box{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:28px;padding:24px;box-shadow:var(--shadow-lg)}
.gbtn{width:100%;background:var(--card);border:1.5px solid var(--border);padding:13px;font-size:15.5px}
.gbtn:hover{background:var(--card2)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:18px 0 14px;font-weight:650}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.pw{position:relative}
.pw input{padding-right:46px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;width:40px;height:40px;border-radius:12px;color:var(--muted)}
.msg{border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:12px;font-weight:650}
.msg.ok{background:var(--accent-soft);color:var(--accent-text)}
.msg.bad{background:var(--danger-soft);color:var(--danger)}
.auth-foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px;font-weight:600}
.splash{min-height:100dvh;display:grid;place-items:center}

@media (max-width:560px){
  .hero{flex-direction:column;align-items:stretch}
  .ring{margin:0 auto}
  .hero-side{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:flex-end}
  .macros{grid-template-columns:1fr}
  .stats4{grid-template-columns:repeat(2,1fr)}
  .avg-grid{grid-template-columns:repeat(2,1fr)}
  .form3{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .cell .dk{display:none}
  .fab{padding:0;width:56px;justify-content:center;border-radius:20px}
  .fab b{display:none}
  .auth-box{padding:20px}
  .seg button{font-size:13px}
  dialog.sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:28px 28px 0 0;max-height:94dvh}
  .sheet-in{max-height:94dvh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  dialog.tall .sheet-in{height:94dvh}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div id="app" hidden>

  <div class="sheet-head">

<script>
'use strict';
/* ---------- Βάση τροφίμων (ανά 100g) ----------

/* ---------- Θρεπτικά, streak, επιτεύγματα ---------- */
function totals(k){const t={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0};const d=S.days[k];if(d&&d.entries)for(const e of d.entries)for(const n of NK)t[n]+=+e[n]||0;return t}
function microTotals(k){const t={},d=S.days[k],es=(d&&d.entries)||[];let known=0;MK.forEach(n=>t[n]=0);
  for(const e of es){if(MK.some(n=>e[n]!=null))known++;for(const n of MK)t[n]+=+e[n]||0}return{t,known,total:es.length}}
function microTargets(){const p=S.profile,f=p.sex==='f',a=+p.age;
  return{sodium:2300,satfat:Math.round(S.goals.kcal*0.1/9),calcium:(f&&a>50)||a>70?1200:1000,iron:f&&a<51?18:8,potassium:f?2600:3400,vitc:f?75:90}}
function status(k){
  const fr=!!S.freezes[k];
  if(!hasE(k))return fr?'freeze':'none';
  const t=totals(k),g=S.goals,tol=(+S.settings.tolerance||10)/100;
  let ok=Math.abs(t.kcal-g.kcal)<=g.kcal*tol;
  if(ok&&S.settings.requireProtein)ok=t.protein>=g.protein*0.9;
  return ok?'hit':fr?'freeze':'miss';
}
function chainEnding(d){let n=0;for(let i=0;i<5000;i++){const s=status(dk(d));if(s==='hit')n++;else if(s!=='freeze')break;d=addDays(d,-1)}return n}
function streaks(){
  let d=new Date();if(status(dk(d))!=='hit')d=addDays(d,-1);
  const cur=chainEnding(d);
  const keys=[...new Set([...Object.keys(S.days),...Object.keys(S.freezes)])].sort();
  let best=0,run=0,prev=null,hits=0,logged=0;
  for(const k of keys){const s=status(k);if(hasE(k))logged++;
    if(s!=='hit'&&s!=='freeze'){prev=null;run=0;continue}
    if(!prev||Math.round((pk(k)-pk(prev))/864e5)!==1)run=0;
    if(s==='hit'){run++;hits++}best=Math.max(best,run);prev=k}
  return{cur,best:Math.max(best,cur),hits,logged};
}
function freezesInMonth(k){const ym=k.slice(0,7);return Object.keys(S.freezes).filter(x=>x.startsWith(ym)).length}
function canFreeze(k){return k<todayK()&&status(k)!=='hit'&&status(k)!=='freeze'&&freezesInMonth(k)===0}
function achStats(){const st=streaks();let ai=0,barcode=0,water=0,prot=0;
  for(const k of Object.keys(S.days)){const d=S.days[k];for(const e of d.entries||[]){if(e.src==='ai')ai++;if(e.src==='barcode')barcode++}
    if((d.water||0)>=S.goals.water)water++;if(hasE(k)&&totals(k).protein>=S.goals.protein)prot++}
  return{...st,ai,barcode,water,prot,saved:S.savedMeals.length}}
function dayObj(k){if(!S.days[k])S.days[k]={entries:[],water:0};if(!S.days[k].entries)S.days[k].entries=[];return S.days[k]}
function addEntry(k,e){dayObj(k).entries.push({id:uid(),...e});save()}
function scaled(per,g){const o={};for(const n of ALLK)if(per[n]!=null&&per[n]!=='')o[n]=r1((+per[n]||0)*g/100);return o}
function itemToEntry(it,meal,src){const g=+it.grams||0,o={meal,name:String(it.name||'Τρόφιμο').slice(0,80),grams:g,src};
  ALLK.forEach(n=>{if(it[n]!=null)o[n]=r1(+it[n]||0)});if(g>0){o.per={};ALLK.forEach(n=>{if(it[n]!=null)o.per[n]=r1((+it[n]||0)/g*100)})}return o}
function statusText(k){const st=status(k);if(st==='none')return['none','Καμία καταγραφή'];if(st==='hit')return['hit','✓ Εντός στόχου'];if(st==='freeze')return['freeze','❄️ Πάγωμα streak'];return['miss',totals(k).kcal<S.goals.kcal?'Κάτω από τον στόχο':'Πάνω από τον στόχο']}
function calcGoals(p){
  const w=+p.weight,bmr=10*w+6.25*(+p.height)-5*(+p.age)+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.activity),adj={lose:-500,lose_slow:-250,maintain:0,gain:300}[p.goal]||0;

  return{bmr,tdee,goals:{kcal,protein,carbs,fat,fiber:Math.round(kcal/1000*14),sugar:Math.round(kcal*0.1/4),water:Math.round(w*35/250)*250}};
}

function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext('2d'),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;
  const cols=['#2f9e5b','#f2a516','#3b82f6','#e0508f','#9b5de5','#10a37f'];
  const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.4,vx:(Math.random()-.5)*18*dpr,vy:(-Math.random()*17-6)*dpr,s:(Math.random()*7+4)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=.45*dpr;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}
    if(++t<180)requestAnimationFrame(f);else c.remove()})();
}

const OFF_FIELDS='code,product_name,product_name_el,brands,nutriments,serving_quantity';
function offToFood(p,src){
  const n=p.nutriments||{},g=k=>{const v=n[k+'_100g'];return v==null||v===''||isNaN(+v)?null:+v};
  let kcal=g('energy-kcal');if(kcal==null){const kj=g('energy-kj')??g('energy');if(kj!=null)kcal=kj/4.184}
  if(kcal==null)return null;
  const per={kcal:r1(kcal),protein:r1(g('proteins')||0),carbs:r1(g('carbohydrates')||0),fat:r1(g('fat')||0),fiber:r1(g('fiber')||0),sugar:r1(g('sugars')||0)};
  const mg=k=>{const v=g(k);return v==null?null:r1(v*1000)};
  const na=g('sodium')!=null?mg('sodium'):g('salt')!=null?r1(g('salt')*400):null;
  const extra={sodium:na,satfat:g('saturated-fat'),calcium:mg('calcium'),iron:mg('iron'),potassium:mg('potassium'),vitc:mg('vitamin-c')};
  for(const k in extra)if(extra[k]!=null)per[k]=r1(extra[k]);
  const brand=String(p.brands||'').split(',')[0].trim();
  const name=String(p.product_name_el||p.product_name||'Προϊόν').trim()+(brand?` · ${brand}`:'');
  const sq=+p.serving_quantity;
  return{name:name.slice(0,80),per,portion:sq>0&&sq<2000?Math.round(sq):100,plabel:'μερίδα',src,code:p.code};
}
async function offProduct(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if(r.status===404)return null;
  if(!r.ok)throw new Error('Η βάση προϊόντων δεν απάντησε. Δοκίμασε ξανά σε λίγο.');
  const j=await r.json();return j.status===1&&j.product?offToFood({...j.product,code},'barcode'):null;
}

const QR_LIB='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
function stopScanner(){const s=scanner;scanner=null;if(s){try{s.stop().catch(()=>{}).finally(()=>{try{s.clear()}catch(e){}})}catch(e){}}}
async function startScanner(){
  add.tab='scan';add.scan={state:'starting',msg:''};renderAdd();
  try{
    await loadScript(QR_LIB);
    if(add.tab!=='scan')return;
    const F=window.Html5QrcodeSupportedFormats;
    scanner=new window.Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false});
    await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(300,w*.85)),height:Math.floor(Math.min(170,h*.55))}),aspectRatio:1.333},code=>onBarcode(code),()=>{});
    add.scan.state='live';$('#scanMsg').textContent='Στόχευσε το barcode μέσα στο πλαίσιο.';
  }catch(e){
    stopScanner();add.scan={state:'error',msg:/permission|notallowed/i.test(String(e))?'Δεν δόθηκε άδεια για την κάμερα. Επίτρεψέ τη από τις ρυθμίσεις του browser ή γράψε τον κωδικό.':'Δεν βρέθηκε κάμερα. Ανέβασε φωτογραφία του barcode ή γράψε τον κωδικό.'};
    if(add.tab==='scan')renderAdd();
  }
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,'');if(code.length<8)return;
  if(add.scan&&add.scan.state==='looking')return;
  stopScanner();add.tab='scan';add.scan={state:'looking',msg:'',code};renderAdd();
  try{
    let f=S.customFoods.find(x=>x.code===code);
    if(f)f={...f,src:'barcode'};else f=await offProduct(code);
    if(!f){add.scan={state:'notfound',code};renderAdd();return}
    add.tab='search';add.sel=f;add.grams=f.portion||100;add.scan=null;renderAdd();
    if(navigator.vibrate)navigator.vibrate(60);
  }catch(e){add.scan={state:'error',msg:e.message,code};renderAdd()}
}

const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64uToBytes(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function serverPrefs(){const r=S.settings.reminders;return{enabled:!!r.enabled,breakfast:r.breakfastOn?r.breakfast:'',lunch:r.lunchOn?r.lunch:'',dinner:r.dinnerOn?r.dinner:'',water:!!r.water,streak:!!r.streak,streakTime:r.streakTime,weekly:!!r.weekly}}
async function ensurePushSub(ask){
  if(DEMO||!pushSupported())return false;
  if(Notification.permission!=='granted'){if(!ask)return false;if(await Notification.requestPermission()!=='granted')return false}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
  const j=sub.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,user_id:user.id,p256dh:j.keys.p256dh,auth:j.keys.auth,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Athens',prefs:serverPrefs(),updated_at:new Date().toISOString()});
  if(error){console.error(error);throw new Error('Δεν αποθηκεύτηκε η συσκευή. Δοκίμασε ξανά.')}
  return true;
}
async function syncRemPrefs(){if(DEMO||!sb)return;const {error}=await sb.from('push_subscriptions').update({prefs:serverPrefs(),updated_at:new Date().toISOString()}).eq('user_id',user.id);if(error)console.error(error)}
async function dropPushSub(){
  if(DEMO||!pushSupported())return;
  try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}
}

function authErr(e){
  const m=String((e&&e.message)||e||'');
  if(/invalid login credentials/i.test(m))return'Λάθος email ή κωδικός.';
  if(/email not confirmed/i.test(m))return'Πρέπει πρώτα να επιβεβαιώσεις το email σου — δες τα εισερχόμενά σου.';
  if(/already registered|already been registered/i.test(m))return'Υπάρχει ήδη λογαριασμός με αυτό το email. Κάνε σύνδεση.';
  if(/at least 6|password should be/i.test(m))return'Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.';
  if(/pwned|leaked|compromised/i.test(m))return'Αυτός ο κωδικός έχει διαρρεύσει σε άλλη υπηρεσία. Διάλεξε διαφορετικό.';
  if(/rate limit|too many/i.test(m))return'Πάρα πολλές προσπάθειες. Δοκίμασε ξανά σε λίγα λεπτά.';
  if(/valid email|invalid email|unable to validate email/i.test(m))return'Το email δεν είναι έγκυρο.';
  if(/provider is not enabled/i.test(m))return'Αυτός ο τρόπος σύνδεσης δεν έχει ενεργοποιηθεί ακόμα.';
  if(/failed to fetch|network/i.test(m))return'Δεν υπάρχει σύνδεση στο ίντερνετ.';
  return m||'Κάτι πήγε στραβά. Δοκίμασε ξανά.';
}

async function authSubmit(form){
  const mode=form.dataset.mode,v=id=>{const el=$('#'+id);return el?el.value.trim():''};

  authBusy=true;authMsg=null;renderAuth();

    if(mode==='signin'){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error}
    else if(mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:v('aName')},emailRedirectTo:APP_URL}});
      if(error)throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(!data.session){authMsg=['ok',`Σου στείλαμε email στο ${email}. Πάτα τον σύνδεσμο για να ενεργοποιήσεις τον λογαριασμό σου.`];authView='signin'}
    }else if(mode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(error)throw error;
      authMsg=['ok','Αν υπάρχει λογαριασμός με αυτό το email, θα λάβεις σύνδεσμο σε λίγα λεπτά.'];
    }else if(mode==='reset'){

      recovery=false;authBusy=false;toast('Ο κωδικός άλλαξε');user=data.user;startApp();return;
    }
  }catch(e){authMsg=['bad',authErr(e)]}
  authBusy=false;if(!user||recovery)renderAuth();
}

      <button class="plus" data-act="openAdd" data-meal="${m}" aria-label="Προσθήκη στο ${name}">+</button></div>
    ${es.map(e=>`<div class="entry"><div class="nm"><b>${esc(e.name)}${e.src==='ai'?'<span class="ai-tag">AI</span>':e.src==='barcode'?'<span class="ai-tag">🏷️</span>':''}</b>
      <small>${e.grams?r0(e.grams)+' g · ':''}Π ${r1(e.protein)} · Υ ${r1(e.carbs)} · Λ ${r1(e.fat)}</small></div>
      <span class="kc">${r0(e.kcal)}</span><button class="del" data-act="del" data-id="${e.id}" aria-label="Διαγραφή">×</button></div>`).join('')}
    ${!es.length&&!yes.length?`<button class="add-btn" data-act="openAdd" data-meal="${m}">+ Πρόσθεσε φαγητό</button>`:''}
    ${(!es.length&&yes.length)||es.length?`<div class="meal-actions">
      ${!es.length&&yes.length?`<button class="mini-btn" data-act="copyYesterday" data-meal="${m}" title="${esc(yes.map(e=>e.name).join(', '))}">↺ Ίδιο με χθες · ${r0(ykc)} kcal</button>`:''}
      ${es.length?`<button class="mini-btn" data-act="saveMeal" data-meal="${m}">⭐ Αποθήκευση γεύματος</button>`:''}</div>`:''}</section>`;
  }
  return h;
}

/* ---------- Charts ---------- */
function barChart(items,goal,H=210){
  const W=640,pl=40,pr=10,pt=18,pb=26,n=items.length;
  const max=Math.max(goal*1.25,...items.map(i=>i.v),1);
  const cw=(W-pl-pr)/n,bw=Math.max(3,Math.min(40,cw*.68));
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Γράφημα θερμίδων">`;
  const step=max>3000?1000:500;
  for(let v=0;v<=max;v+=step)s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  items.forEach((it,i)=>{
    const x=pl+cw*i+(cw-bw)/2;
    if(it.v>0)s+=`<rect class="bar ${it.c}" x="${x}" y="${y(it.v)}" width="${bw}" height="${Math.max(1,y(0)-y(it.v))}" rx="${Math.min(5,bw/3)}"><title>${esc(it.t||'')}</title></rect>`;
    else s+=`<rect class="bar ${it.c==='freeze'?'freeze':'none'}" x="${x}" y="${y(0)-3}" width="${bw}" height="3" rx="1.5"/>`;
    if(n<=12&&it.v>0)s+=`<text class="v" x="${x+bw/2}" y="${y(it.v)-5}" text-anchor="middle">${r0(it.v)}</text>`;
    if(n<=12||i%(n>20?2:1)===0)s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(it.l)}</text>`;
  });
  s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W-pr}" y="${y(goal)-5}" text-anchor="end">στόχος ${r0(goal)}</text></svg>`;
  return s;
}
function lineChart(pts,H=170){
  if(pts.length<2)return`<p class="muted small">Καταχώρησε βάρος σε τουλάχιστον 2 μέρες αυτής της περιόδου για να δεις γράφημα.</p>`;
  const W=640,pl=40,pr=12,pt=14,pb=24;
  const vs=pts.map(p=>p.v),mn=Math.floor(Math.min(...vs)-1),mx=Math.ceil(Math.max(...vs)+1);
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
  const x=t=>pl+(W-pl-pr)*((t-t0)/((t1-t0)||1)),y=v=>pt+(H-pt-pb)*(1-(v-mn)/((mx-mn)||1));
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Γράφημα βάρους">`;
  for(const v of [mn,(mn+mx)/2,mx])s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${r1(v)}</text>`;
  s+=`<polyline class="ln" points="${pts.map(p=>`${x(p.t)},${y(p.v)}`).join(' ')}"/>`;
  pts.forEach(p=>s+=`<circle class="pt" cx="${x(p.t)}" cy="${y(p.v)}" r="3.5"><title>${esc(p.l)}: ${p.v} kg</title></circle>`);
  s+=`<text x="${pl}" y="${H-6}">${esc(pts[0].l)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1].l)}</text></svg>`;
  return s;
}
function weightCard(keys){
  const pts=keys.filter(k=>S.days[k]&&S.days[k].weight).map(k=>({t:pk(k).getTime(),v:+S.days[k].weight,l:fmtDate(pk(k),{day:'numeric',month:'short'})}));
  let diff='';
  if(pts.length>=2){const d=r1(pts[pts.length-1].v-pts[0].v);diff=`<span class="badge ${d<=0?'hit':'miss'}" style="float:right">${d>0?'+':''}${String(d).replace('.',',')} kg</span>`}
  return`<section class="card"><h3>⚖️ Βάρος ${diff}</h3>${lineChart(pts)}</section>`;
}
function avgBlock(keys,title){
  const lk=keys.filter(hasE),hits=keys.filter(k=>status(k)==='hit').length;
  if(!lk.length)return`<section class="card"><h3>${title}</h3><p class="muted">Δεν υπάρχουν καταγραφές σε αυτή την περίοδο.</p></section>`;
  const sum={kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0};
  lk.forEach(k=>{const t=totals(k);NK.forEach(n=>sum[n]+=t[n])});
  const avgW=lk.reduce((a,k)=>a+(S.days[k].water||0),0)/lk.length;
  return`<section class="card"><h3>${title}</h3>
   <div class="avg-grid">${NK.map(n=>`<div class="avg"><span>${NL[n]}</span><b>${r0(sum[n]/lk.length)}</b> <small>/ ${r0(S.goals[n])} ${NU[n]}</small></div>`).join('')}</div>
   <div class="info">✅ Επιτυχία στόχου σε <b>${hits}</b> από <b>${lk.length}</b> μέρες καταγραφής (${r0(hits/lk.length*100)}%) · 💧 μέσος όρος νερού ${fmtL(avgW)} L</div>
  </section>`;
}
const LEGEND=`<div class="legend"><span><i style="background:var(--accent)"></i>Εντός στόχου</span><span><i style="background:var(--warn)"></i>Εκτός στόχου</span><span><i style="background:var(--ice)"></i>Πάγωμα</span><span><i style="background:var(--none)"></i>Χωρίς καταγραφή</span></div>`;

/* ---------- Πρόοδος ---------- */
function renderProgress(){
  const s=streaks(),a=prog.anchor,today=new Date(),st=achStats(),unlocked=ACH.filter(x=>x[4](st)).length;
  let h=`<div class="stats4">
    <div class="sc fire"><div class="e">🔥</div><b>${s.cur}</b><span>τρέχον streak</span></div>
    <div class="sc"><div class="e">🏆</div><b>${s.best}</b><span>καλύτερο streak</span></div>

    <div class="ach">${ACH.map(x=>`<div class="${x[4](st)?'':'locked'}"><span class="e">${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></div>`).join('')}</div>
    <div class="small muted" style="margin-top:10px">❄️ Πάγωμα streak: 1 τον μήνα — ${freezesInMonth(todayK())?'το χρησιμοποίησες αυτόν τον μήνα':'διαθέσιμο αυτόν τον μήνα'}.</div></details>
  <div class="seg">${[['day','Ημέρα'],['week','Εβδομάδα'],['month','Μήνας'],['year','Έτος']].map(([v,l])=>`<button class="${prog.view===v?'on':''}" data-act="pview" data-v="${v}">${l}</button>`).join('')}</div>`;
  let title='',nextDis=false;
  if(prog.view==='day'){title=cap(fmtDate(a,{weekday:'short',day:'numeric',month:'long',year:'numeric'}));nextDis=dk(a)>=dk(today)}
  else if(prog.view==='week'){const m=mondayOf(a),e=addDays(m,6);title=`${fmtDate(m,{day:'numeric',month:'short'})} – ${fmtDate(e,{day:'numeric',month:'short',year:'numeric'})}`;nextDis=dk(e)>=dk(today)}
  else if(prog.view==='month'){title=cap(fmtDate(a,{month:'long',year:'numeric'}));nextDis=a.getFullYear()*12+a.getMonth()>=today.getFullYear()*12+today.getMonth()}
  else{title=String(a.getFullYear());nextDis=a.getFullYear()>=today.getFullYear()}
  h+=`<div class="period-nav"><button class="icon-btn" data-act="pnav" data-d="-1" aria-label="Προηγούμενο">‹</button><div>${title}</div><button class="icon-btn" data-act="pnav" data-d="1" ${nextDis?'disabled':''} aria-label="Επόμενο">›</button></div>`;
  if(prog.view==='day')h+=progDay(a);
  else if(prog.view==='week')h+=progWeek(a);
  else if(prog.view==='month')h+=progMonth(a);
  else h+=progYear(a);
  return h;
}
function progDay(a){
  const k=dk(a),t=totals(k),g=S.goals,d=S.days[k]||{},[sc,stxt]=statusText(k),mt=microTotals(k),tg=microTargets();
  let h=`<section class="card"><div class="meal-head"><h3>Σύνοψη ημέρας</h3><span class="badge ${sc}">${stxt}</span></div>
  <table class="nt"><tr><th>Θρεπτικό</th><th>Κατανάλωση</th><th>Στόχος</th><th>%</th></tr>
  ${NK.map(n=>`<tr><td>${NL[n]}</td><td><b>${r0(t[n])}</b> ${NU[n]}</td><td>${r0(g[n])}</td><td>${g[n]?r0(t[n]/g[n]*100):0}%</td></tr>`).join('')}
  <tr><td>Νερό</td><td><b>${r0(d.water||0)}</b> ml</td><td>${r0(g.water)}</td><td>${g.water?r0((d.water||0)/g.water*100):0}%</td></tr>
  ${d.weight?`<tr><td>Βάρος</td><td><b>${d.weight}</b> kg</td><td>—</td><td>—</td></tr>`:''}
  ${mt.known?`<tr class="sep"><td colspan="4">Μικροθρεπτικά (από ${mt.known}/${mt.total} τρόφιμα)</td></tr>`+MK.map(n=>`<tr><td>${NL[n]}</td><td><b>${NU[n]==='mg'?r0(mt.t[n]):r1(mt.t[n])}</b> ${NU[n]}</td><td>${tg[n]}${LIMITS.has(n)?' (όριο)':''}</td><td>${r0(mt.t[n]/tg[n]*100)}%</td></tr>`).join(''):''}
  </table></section>`;
  if(canFreeze(k))h+=`<div class="tip ice"><span class="e">❄️</span><div><b>Πάγωμα streak</b><br><span class="muted">Σώσε το streak σου για αυτή τη μέρα (1 τον μήνα).</span></div><button class="btn" data-act="freeze" data-k="${k}">Πάγωμα</button></div>`;
  else if(S.freezes[k]&&status(k)==='freeze')h+=`<div class="tip ice"><span class="e">❄️</span><div><b>Αυτή η μέρα είναι παγωμένη</b><br><span class="muted">Το streak σου συνεχίζεται κανονικά.</span></div><button class="btn" data-act="unfreeze" data-k="${k}">Αναίρεση</button></div>`;
  const es=d.entries||[];
  if(es.length){
    h+=`<section class="card"><h3>Τι έφαγες</h3>`;
    for(const [m,name,ic] of MEALS){const x=es.filter(e=>e.meal===m);if(!x.length)continue;
      h+=`<div class="small muted" style="margin:10px 0 2px;font-weight:700">${ic} ${name}</div>`+x.map(e=>`<div class="entry"><div class="nm"><b>${esc(e.name)}</b><small>${e.grams?r0(e.grams)+' g · ':''}Π ${r1(e.protein)} · Υ ${r1(e.carbs)} · Λ ${r1(e.fat)}</small></div><span class="kc">${r0(e.kcal)}</span></div>`).join('')}
    h+=`</section>`;
  }
  h+=`<button class="btn block" data-act="editDay" data-k="${k}">✏️ Επεξεργασία αυτής της μέρας</button>`;
  return h;
}
function weekKeys(a){const m=mondayOf(a);return Array.from({length:7},(_,i)=>dk(addDays(m,i)))}
function reviewCard(a){
  const keys=weekKeys(a),wk=keys[0],rv=S.reviews[wk],logged=keys.filter(hasE).length;
  let h=`<section class="card rv" id="reviewCard"><div class="meal-head"><h3>🧠 Ανασκόπηση εβδομάδας</h3>${rv&&!rvBusy?`<button class="chip" data-act="review" data-k="${wk}">↻ Ανανέωση</button>`:''}</div>`;
  if(rvBusy)h+=`<div class="row"><div class="spinner sm"></div><span class="muted">Ο Nutri μελετά την εβδομάδα σου…</span></div>`;
  else if(rv){const r=rv.r;h+=`<div class="score"><div class="num" style="--p:${clamp(+r.score||0,0,100)}"><span>${r0(r.score)}</span></div><div><b>${esc(r.headline)}</b><div class="small muted">${esc(r.summary)}</div></div></div>
    <h4>👍 Τι πήγε καλά</h4><ul>${(r.wins||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h4>🎯 Τι να βελτιώσεις</h4><ul>${(r.improve||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="note">🚀 <b>Στόχος επόμενης εβδομάδας:</b> ${esc(r.next_goal)}</div>
    <div class="small muted" style="margin-top:8px">Δημιουργήθηκε ${fmtDate(new Date(rv.at),{day:'numeric',month:'short'})}${rv.logged!==logged?' · υπάρχουν νέες καταγραφές από τότε':''}</div>`}
  else if(!logged)h+=`<p class="muted small" style="margin:0">Κατέγραψε τουλάχιστον μία μέρα αυτής της εβδομάδας για να πάρεις ανασκόπηση.</p>`;
  else h+=`<p class="muted small" style="margin:0 0 10px">Ο Nutri θα αναλύσει τις ${logged} ${logged===1?'μέρα':'μέρες'} καταγραφής σου και θα σου πει τι πήγε καλά και τι να βελτιώσεις.</p><button class="btn primary block" data-act="review" data-k="${wk}">✨ Δημιουργία ανασκόπησης</button>`;

function progWeek(a){
  const keys=weekKeys(a);
  const items=keys.map((k,i)=>({v:totals(k).kcal,c:status(k),l:WD[i],t:`${fmtDate(pk(k),{day:'numeric',month:'short'})}: ${r0(totals(k).kcal)} kcal`}));
  return`<section class="card"><h3>Θερμίδες ανά ημέρα</h3>${barChart(items,S.goals.kcal)}${LEGEND}</section>
    ${reviewCard(a)}${avgBlock(keys,'Μέσοι όροι εβδομάδας')}${weightCard(keys)}`;
}
function progMonth(a){
  const y=a.getFullYear(),mo=a.getMonth(),days=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7,tk=todayK();
  const keys=Array.from({length:days},(_,i)=>dk(new Date(y,mo,i+1)));
  let cal=WD.map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="cell empty"></div>'.repeat(off);
  keys.forEach((k,i)=>{const st=status(k),fut=k>tk,t=totals(k);
    cal+=`<button class="cell ${st!=='none'?st:''} ${k===tk?'today':''} ${fut?'future':''}" ${fut?'disabled':''} data-act="gotoDay" data-k="${k}" title="${st==='none'?'Χωρίς καταγραφή':st==='freeze'&&!hasE(k)?'Πάγωμα':r0(t.kcal)+' kcal'}"><span class="dn">${i+1}</span>${hasE(k)?`<span class="dk">${r0(t.kcal)}</span>`:st==='freeze'?'<span class="dk">❄️</span>':''}</button>`});
  const items=keys.map((k,i)=>({v:totals(k).kcal,c:status(k),l:String(i+1),t:`${i+1}/${mo+1}: ${r0(totals(k).kcal)} kcal`}));
  return`<section class="card"><h3>Ημερολόγιο</h3><div class="cal">${cal}</div>${LEGEND}<div class="small muted" style="margin-top:6px">Πάτα μια μέρα για λεπτομέρειες.</div></section>
    <section class="card"><h3>Θερμίδες ανά ημέρα</h3>${barChart(items,S.goals.kcal)}</section>
    ${avgBlock(keys,'Μέσοι όροι μήνα')}${weightCard(keys)}`;
}
function progYear(a){
  const y=a.getFullYear(),tk=todayK(),tol=(+S.settings.tolerance||10)/100;
  const items=[],allKeys=[];
  for(let m=0;m<12;m++){
    const n=new Date(y,m+1,0).getDate(),ks=Array.from({length:n},(_,i)=>dk(new Date(y,m,i+1)));allKeys.push(...ks);
    const lk=ks.filter(hasE),hits=ks.filter(k=>status(k)==='hit').length;
    const avg=lk.length?lk.reduce((s,k)=>s+totals(k).kcal,0)/lk.length:0;
    items.push({v:avg,c:!lk.length?'none':Math.abs(avg-S.goals.kcal)<=S.goals.kcal*tol?'hit':'miss',l:MONTHS[m],t:`${MONTHS[m]}: μ.ό. ${r0(avg)} kcal · ${hits}/${lk.length} μέρες επιτυχίας`});
  }
  const off=(new Date(y,0,1).getDay()+6)%7;
  let heat='<i class="blank"></i>'.repeat(off);
  allKeys.forEach(k=>{const st=status(k);heat+=`<i class="${st!=='none'?st:''} ${k>tk?'future':''}" title="${fmtDate(pk(k),{day:'numeric',month:'short'})}${hasE(k)?' · '+r0(totals(k).kcal)+' kcal':''}"></i>`});
  return`<section class="card"><h3>Χάρτης συνέπειας</h3><div class="heat-wrap"><div class="heat">${heat}</div></div>${LEGEND}</section>
    <section class="card"><h3>Μέσες ημερήσιες θερμίδες ανά μήνα</h3>${barChart(items,S.goals.kcal)}</section>
    ${avgBlock(allKeys,'Μέσοι όροι έτους')}${weightCard(allKeys)}`;
}
async function makeReview(wk){
  if(rvBusy)return;rvBusy=true;render();
  const keys=weekKeys(pk(wk));
  try{
    const week=keys.map(k=>{const t=totals(k),d=S.days[k]||{};return{date:k,weekday:fmtDate(pk(k),{weekday:'long'}),status:status(k),kcal:r0(t.kcal),protein:r0(t.protein),carbs:r0(t.carbs),fat:r0(t.fat),fiber:r0(t.fiber),sugar:r0(t.sugar),water:d.water||0,entries:(d.entries||[]).length,weight:d.weight||null}});
    const r=await callAI({action:'review',week,context:aiContext()});
    S.reviews[wk]={r:r.result,at:Date.now(),logged:keys.filter(hasE).length};
    const ks=Object.keys(S.reviews).sort();while(ks.length>12)delete S.reviews[ks.shift()];
    save();
  }catch(e){toast('⚠️ '+e.message)}
  rvBusy=false;if(tab==='progress')render();
}

/* ---------- Σάρωση γεύματος ---------- */
async function analyze(){
  if(!ai.b64&&!ai.desc.trim()){toast('Ανέβασε φωτογραφία ή γράψε μια περιγραφή');return}
  ai.loading=true;ai.error='';ai.result=null;render();
  try{
    const r=await callAI({action:'analyze',image:ai.b64||null,desc:ai.desc.trim(),context:aiContext()});
    const j=r.result||{};
    ai.result={isFood:j.is_food!==false,dish:j.dish||'',notes:j.notes||'',confidence:j.confidence||'medium',
      items:(j.items||[]).map(it=>{const g=+it.grams||0;const base={grams:g};ALLK.forEach(n=>{if(it[n]!=null)base[n]=+it[n]||0});return{on:true,name:it.name||'Τρόφιμο',grams:g,base}})};
  }catch(e){ai.error=e.message||String(e)}
  ai.loading=false;if(tab==='ai')render();
}
function itemVals(it){const f=it.base.grams?it.grams/it.base.grams:1;const o={};ALLK.forEach(n=>{if(it.base[n]!=null)o[n]=r1(it.base[n]*f)});NK.forEach(n=>{if(o[n]==null)o[n]=0});return o}

function loadImage(file){
  if(!file)return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const M=1024,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const du=c.toDataURL('image/jpeg',0.85);ai.img=du;ai.b64=du.split(',')[1];ai.result=null;ai.error='';URL.revokeObjectURL(url);render()};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Δεν ήταν δυνατή η ανάγνωση της εικόνας')};
  img.src=url;
}

function sugTotals(items){const t={kcal:0,protein:0,carbs:0,fat:0};items.forEach(i=>{for(const n in t)t[n]+=+i[n]||0});return t}
function renderSug(){

  if(sug.loading)h+=`<div style="text-align:center;padding:18px"><div class="spinner"></div></div>`;
  if(sug.error)h+=`<div class="err" style="margin-top:10px">⚠️ ${esc(sug.error)}</div>`;

    if(sug.result.intro)h+=`<p class="small muted" style="margin:12px 0 0">${esc(sug.result.intro)}</p>`;
    h+=(sug.result.suggestions||[]).map((s,i)=>{const tt=sugTotals(s.items||[]);return`<div class="sug"><b class="t">${esc(s.title)}</b><p>${esc(s.why)}</p>
      <ul>${(s.items||[]).map(it=>`<li>${esc(it.name)} — ${r0(it.grams)} g · ${r0(it.kcal)} kcal</li>`).join('')}</ul>
      <div class="row"><span class="small"><b>${r0(tt.kcal)} kcal</b> · Π ${r0(tt.protein)} · Υ ${r0(tt.carbs)} · Λ ${r0(tt.fat)}</span><button class="btn primary sm" data-act="sugAdd" data-i="${i}">Προσθήκη</button></div></div>`}).join('');
  }
  $('#sugIn').innerHTML=h+'</div>';
}
async function runSuggest(){
  sug.meal=$('#sugMeal').value;sug.wish=$('#sugWish').value.trim();sug.loading=true;sug.error='';renderSug();

  sug.loading=false;renderSug();
}

function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',list=false;
  for(const l of lines){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){if(!list){h+='<ul>';list=true}h+=`<li>${m[1]}</li>`;continue}
    if(list){h+='</ul>';list=false}
    if(l.trim())h+=`<p>${l.replace(/^#+\s*/,'')}</p>`}
  return h+(list?'</ul>':'');
}

async function sendChat(text){
  text=(text||'').trim();if(!text||chat.busy)return;
  chat.msgs.push({role:'user',text});chat.busy=true;renderChat();
  try{
    const hist=chat.msgs.filter(m=>!m.local).slice(-16).map(m=>({role:m.role,text:m.text}));
    const r=await callAI({action:'chat',messages:hist,context:{...aiContext(),tab}});
    chat.msgs.push({role:'model',text:r.text||'…',actions:(r.actions||[]).map(a=>({...a,done:null}))});

function recents(){
  const seen=new Set(),out=[];
  for(const k of Object.keys(S.days).sort().reverse()){
    for(const e of [...(S.days[k].entries||[])].reverse()){if(!e.per||seen.has(e.name))continue;seen.add(e.name);out.push({name:e.name,per:e.per,portion:e.grams||100,plabel:'τελευταία φορά',src:'recent'});if(out.length>=8)return out}
  }
  return out;
}
