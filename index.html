  openAdd:el=>openAdd(el.dataset.meal),
  closeDlg:closeAdd,
  addTab:el=>{stopScanner();add.tab=el.dataset.t;add.sel=null;add.scan=null;if(el.dataset.t!=='custom')add.prefillCode='';renderAdd()},
  pick:el=>{const f=addList[+el.dataset.i];if(!f)return;add.sel=f;add.grams=f.portion||100;renderAdd()},
  unpick:()=>{add.sel=null;renderAdd()},
  setG:el=>{add.grams=+el.dataset.g;$('#gramsIn').value=add.grams;$('#selPrev').innerHTML=selPrev()},
  addSel:()=>{const g=+add.grams;if(!(g>0)){toast('Δώσε ποσότητα σε γραμμάρια');return}
    const f=add.sel,src=f.src==='barcode'?'barcode':f.src==='off'?'off':'db';
    addEntry(dk(curDate),{meal:add.meal,name:f.name,grams:g,per:f.per,...scaled(f.per,g),src});closeAdd();render();toast(`Προστέθηκε: ${f.name}`)},
  quickAdd:()=>{const name=($('#qa_name').value||'').trim()||'Γρήγορη καταχώρηση',v={};NK.forEach(n=>v[n]=numVal('qa_'+n));
    if(!v.kcal){toast('Συμπλήρωσε τουλάχιστον τις θερμίδες');return}
    addEntry(dk(curDate),{meal:add.meal,name,grams:0,...v,src:'quick'});closeAdd();render();toast(`Προστέθηκε: ${name}`)},
  saveCustom:()=>{const name=($('#cf_name').value||'').trim();if(!name){toast('Δώσε όνομα');return}
    const per={};NK.forEach(n=>per[n]=numVal('cf_'+n));if(!per.kcal){toast('Συμπλήρωσε τις θερμίδες ανά 100g');return}
    const sat=optVal('cf_satfat'),salt=optVal('cf_salt');if(sat!=null)per.satfat=sat;if(salt!=null)per.sodium=r1(salt*400);
    const code=($('#cf_code').value||'').replace(/\D/g,'');
    const f={name,per,portion:numVal('cf_portion')||100,plabel:($('#cf_plabel').value||'').trim()||'μερίδα',...(code?{code}:{})};
    if(code)S.customFoods=S.customFoods.filter(x=>x.code!==code);
    S.customFoods.push(f);save();add.tab='search';add.sel={...f,src:code?'barcode':'custom'};add.grams=f.portion;add.prefillCode='';renderAdd();toast('Το τρόφιμο αποθηκεύτηκε')},
  aiFromAdd:()=>{ai.desc=add.q;closeAdd();tab='ai';render()},
  offSearch,
  scan:()=>{add.sel=null;startScanner()},
  scanFromAI:()=>{openAdd(guessMeal());startScanner()},
  codeGo:()=>onBarcode($('#codeIn').value),
  barcodeFile:()=>$('#fileBarcode').click(),
  newFromCode:el=>{add.tab='custom';add.prefillCode=el.dataset.code;add.scan=null;renderAdd()},
  useSavedMeal:el=>{const m=S.savedMeals[+el.dataset.i];if(!m)return;addSavedItems(dk(curDate),add.meal,m.items);closeAdd();render();toast(`Προστέθηκε: ${m.name}`)},
  copyYesterday:el=>{const m=el.dataset.meal,yes=((S.days[dk(addDays(curDate,-1))]||{}).entries||[]).filter(e=>e.meal===m);if(!yes.length)return;
    addSavedItems(dk(curDate),m,yes.map(e=>({...e})));render();toast(`Αντιγράφηκαν ${yes.length} τρόφιμα από χθες`)},
  saveMeal:el=>{const m=el.dataset.meal,es=((S.days[dk(curDate)]||{}).entries||[]).filter(e=>e.meal===m);if(!es.length)return;
    const name=(prompt('Όνομα για το γεύμα:',`${mealName(m)}: ${es.slice(0,2).map(e=>e.name).join(' & ')}`)||'').trim();if(!name)return;
    S.savedMeals.push({id:uid(),name:name.slice(0,60),items:es.map(e=>{const x={...e};delete x.id;delete x.meal;return x})});save();render();toast('⭐ Το γεύμα αποθηκεύτηκε')},
  delSavedMeal:el=>{const m=S.savedMeals[+el.dataset.i];if(m&&confirm(`Διαγραφή «${m.name}»;`)){S.savedMeals.splice(+el.dataset.i,1);save();render()}},
  freeze:el=>{const k=el.dataset.k;if(!canFreeze(k)){toast('Δεν υπάρχει διαθέσιμο πάγωμα για αυτόν τον μήνα');return}
    S.freezes[k]=true;save();render();toast(`❄️ Το streak σου σώθηκε — ${streaks().cur} μέρες`)},
  unfreeze:el=>{delete S.freezes[el.dataset.k];save();render()},
  suggest:openSuggest,
  closeSug:()=>$('#sugDlg').close(),
  runSuggest,
  sugAdd:el=>{const s=sug.result.suggestions[+el.dataset.i];if(!s)return;const k=todayK();(s.items||[]).forEach(it=>dayObj(k).entries.push({id:uid(),...itemToEntry(it,sug.meal,'ai')}));save();
    $('#sugDlg').close();curDate=new Date();tab='today';render();toast(`Προστέθηκε: ${s.title}`)},
  review:el=>makeReview(el.dataset.k),
  pview:el=>{prog.view=el.dataset.v;render()},
  pnav:el=>{const d=+el.dataset.d,a=prog.anchor;
    if(prog.view==='day')prog.anchor=addDays(a,d);
    else if(prog.view==='week')prog.anchor=addDays(a,7*d);
    else if(prog.view==='month')prog.anchor=new Date(a.getFullYear(),a.getMonth()+d,1);
    else prog.anchor=new Date(a.getFullYear()+d,0,1);
    if(prog.anchor>new Date())prog.anchor=new Date();render()},
  gotoDay:el=>{prog.view='day';prog.anchor=pk(el.dataset.k);render();window.scrollTo(0,0)},
  editDay:el=>{curDate=pk(el.dataset.k);tab='today';render();window.scrollTo(0,0)},
  pickImg:el=>$(el.dataset.src==='cam'?'#fileCam':'#fileGal').click(),
  clearImg:()=>{ai.img=ai.b64=null;ai.result=null;ai.error='';render()},
  analyze,
  aiAdd:()=>{const R=ai.result;if(!R)return;const k=todayK();let n=0;
    R.items.forEach(it=>{if(!it.on||!(it.grams>0))return;dayObj(k).entries.push({id:uid(),...itemToEntry({...itemVals(it),name:it.name,grams:it.grams},ai.meal,'ai')});n++});
    if(!n){toast('Δεν επιλέχθηκε κανένα στοιχείο');return}
    save();toast(`Προστέθηκαν ${n} στοιχεία στο ${mealName(ai.meal)}`);ai={img:null,b64:null,desc:'',loading:false,error:'',result:null,meal:guessMeal()};curDate=new Date();tab='today';render();window.scrollTo(0,0)},
  reloadModels:()=>{models.err='';loadModels()},
  theme:el=>{S.settings.theme=el.dataset.v;applyTheme(S.settings.theme);save();const y=window.scrollY;render();window.scrollTo(0,y)},
  delCustom:el=>{const f=S.customFoods[+el.dataset.i];if(f&&confirm(`Διαγραφή «${f.name}»;`)){S.customFoods.splice(+el.dataset.i,1);save();render()}},
  export:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`nutrilog-${todayK()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  import:()=>$('#fileImport').click(),
  reset:()=>{if(confirm('Θα σβηστούν ΟΛΑ τα δεδομένα σου (καταγραφές, στόχοι, τρόφιμα) από όλες τις συσκευές, αλλά ο λογαριασμός θα μείνει. Συνέχεια;')){const c=S.consent;S=defState();S.consent=c;save();render();openWizard(true)}},
  logout:async()=>{
    if(!DEMO&&syncState!=='ok'){await pushNow();if(syncState!=='ok'&&!confirm('Κάποιες αλλαγές δεν έχουν αποθηκευτεί ακόμα (δεν υπάρχει σύνδεση). Αποσύνδεση ούτως ή άλλως;'))return}
    else if(!confirm('Αποσύνδεση από το NutriLog;'))return;
    await dropPushSub();
    try{localStorage.removeItem(cacheKey());localStorage.removeItem(chatKey())}catch(e){}
    if(DEMO){location.reload();return}
    await sb.auth.signOut({scope:'local'});
  },
  deleteAccount:async el=>{
    const t=prompt('Αυτό θα διαγράψει ΟΡΙΣΤΙΚΑ τον λογαριασμό και όλα τα δεδομένα σου.\n\nΓράψε ΔΙΑΓΡΑΦΗ για επιβεβαίωση:');
    if(t===null)return;if(t.trim().toUpperCase()!=='ΔΙΑΓΡΑΦΗ'){toast('Η διαγραφή ακυρώθηκε');return}
    if(DEMO){localStorage.clear();location.reload();return}
    el.disabled=true;el.textContent='Διαγραφή…';
    try{
      clearTimeout(pushT);await dropPushSub();
      await invoke('account',{action:'delete',confirm:'ΔΙΑΓΡΑΦΗ'});
      try{localStorage.removeItem(cacheKey());localStorage.removeItem(chatKey())}catch(e){}
      authMsg=['ok','Ο λογαριασμός σου και όλα τα δεδομένα σου διαγράφηκαν οριστικά.'];
      await sb.auth.signOut({scope:'local'}).catch(()=>{});onSignedOut();
    }catch(e){toast('⚠️ '+e.message);el.disabled=false;el.textContent='Διαγραφή λογαριασμού'}
  },
  testPush:async el=>{el.disabled=true;try{await ensurePushSub(true);const r=await invoke('reminders',{action:'test'});toast(r.sent?'✓ Στάλθηκε! Θα εμφανιστεί σε λίγα δευτερόλεπτα.':'Δεν στάλθηκε — δοκίμασε να απενεργοποιήσεις και να ενεργοποιήσεις ξανά.')}catch(e){toast('⚠️ '+e.message)}el.disabled=false},
  // σύνδεση
  google:async()=>{authMsg=null;const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:APP_URL}});if(error){authMsg=['bad',authErr(error)];renderAuth()}},
  authView:el=>{authMsg=null;renderAuth(el.dataset.v)},
  pwToggle:el=>{const i=el.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'},
  consentOk:()=>{if(!$('#consentChk').checked){toast('Τσέκαρε το κουτάκι για να συνεχίσεις');return}giveConsent();save();$('#consentDlg').close();setTimeout(checkCelebrations,400)},
  // οδηγός
  wizard:()=>openWizard(false),
  wzSet:el=>{wiz.p[el.dataset.f]=el.dataset.f==='activity'?parseFloat(el.dataset.v):el.dataset.v;renderWizard()},
  wzStep:el=>{const f=el.dataset.f,v=r1((+wiz.p[f]||0)+(+el.dataset.d));wiz.p[f]=v;const i=document.querySelector(`[data-wiz="${f}"]`);if(i)i.value=v},
  wzNav:el=>{const d=+el.dataset.d;if(d>0){const e=wizValid();if(e){toast(e);return}}wiz.step=clamp(wiz.step+d,wiz.first?0:1,4);renderWizard();$('#wizIn').scrollTop=0},
  wzDone:()=>{const first=wiz.first;if(!S.consent&&wiz.agree)giveConsent();S.profile={...wiz.p,name:(wiz.p.name||'').trim()};S.goals=calcGoals(S.profile).goals;S.onboarded=true;save();$('#wizDlg').close();wiz=null;render();
    toast('Οι στόχοι σου αποθηκεύτηκαν 🎯');if(first)setTimeout(openChat,500)},
  wzSkip:()=>{if(!S.consent&&!wiz.agree){toast('Για να συνεχίσεις, αποδέξου τους όρους και την πολιτική απορρήτου.');return}
    if(!S.consent)giveConsent();S.onboarded=true;if(wiz.p.name)S.profile.name=wiz.p.name.trim();save();$('#wizDlg').close();wiz=null;render()},
  wzClose:()=>{$('#wizDlg').close();wiz=null},
  // βοηθός
  chat:openChat,
  closeChat:()=>$('#chatDlg').close(),
  chatAsk:el=>sendChat(el.dataset.q),
  chatNew:()=>{chat.msgs=[{role:'model',local:true,text:welcomeText()}];saveChat();renderChat()},
  actAdd:el=>{const [mi,ai_]=el.dataset.k.split(':').map(Number),a=chat.msgs[mi]&&chat.msgs[mi].actions[ai_];if(!a||a.done)return;
    const k=a.day==='yesterday'?dk(addDays(new Date(),-1)):todayK();
    a.items.forEach(it=>dayObj(k).entries.push({id:uid(),...itemToEntry(it,a.meal,'ai')}));a.done='added';save();saveChat();renderChat();
    if(tab==='today')render();toast(`Προστέθηκε στο ${mealName(a.meal)}`)},
  actCancel:el=>{const [mi,ai_]=el.dataset.k.split(':').map(Number),a=chat.msgs[mi]&&chat.msgs[mi].actions[ai_];if(a){a.done='cancelled';saveChat();renderChat()}},
  celClose:nextCel
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
['#dlg','#chatDlg','#sugDlg'].forEach(s=>$(s).addEventListener('click',e=>{if(e.target===$(s)){if(s==='#dlg')closeAdd();else $(s).close()}}));
$('#dlg').addEventListener('close',stopScanner);
$('#wizDlg').addEventListener('cancel',e=>{if(wiz&&wiz.first){e.preventDefault();return}wiz=null});
$('#consentDlg').addEventListener('cancel',e=>e.preventDefault());
$('#celebrate').addEventListener('click',e=>{if(e.target.id==='celebrate')nextCel()});
$('#chatForm').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatIn');const t=i.value;i.value='';i.style.height='';sendChat(t)});
$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chatForm').requestSubmit()}});
$('#chatIn').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'});
document.addEventListener('submit',e=>{if(e.target.id==='authForm'){e.preventDefault();authSubmit(e.target)}});
document.addEventListener('toggle',e=>{if(e.target.id==='microCard')try{sessionStorage.setItem('microOpen',e.target.open?'1':'0')}catch(x){}},true);
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.input==='q'){add.q=el.value;refreshResults();const r=$('#results');if(r)r.scrollTop=0}
  else if(el.dataset.input==='grams'){add.grams=parseFloat(el.value)||0;$('#selPrev').innerHTML=selPrev()}
  else if(el.dataset.input==='aidesc')ai.desc=el.value;
  else if(el.dataset.ainame!==undefined&&ai.result)ai.result.items[+el.dataset.ainame].name=el.value;
  else if(el.dataset.wiz&&wiz){const f=el.dataset.wiz;wiz.p[f]=f==='name'?el.value:parseFloat(el.value)}
  else if(el.dataset.set==='settings.tolerance'){const t=+el.value;$('#tolVal').textContent=`±${t}%`;$('#tolRange').textContent=`Δηλαδή ${r0(S.goals.kcal*(1-t/100))}–${r0(S.goals.kcal*(1+t/100))} kcal την ημέρα`}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.set){
    const [a,b]=el.dataset.set.split('.');let v;
    if(el.type==='checkbox')v=el.checked;
    else if(el.type==='number'||el.type==='range'){v=parseFloat(el.value);if(isNaN(v))return}
    else v=el.value;
    S[a][b]=v;save();
    if(b==='model')toast(v?`Μοντέλο: ${modelLabel(v)}`:'Αυτόματη επιλογή μοντέλου');
    const y=window.scrollY;render();window.scrollTo(0,y);
    return;
  }
  if(el.dataset.actChange==='remToggle'){
    const r=S.settings.reminders;
    if(el.checked){el.disabled=true;
      try{if(await ensurePushSub(true)){r.enabled=true;save();await syncRemPrefs();toast('🔔 Οι υπενθυμίσεις ενεργοποιήθηκαν')}else{toast('Δεν δόθηκε άδεια για ειδοποιήσεις');}}
      catch(err){toast('⚠️ '+(err.message||'Δεν ήταν δυνατή η ενεργοποίηση'))}}
    else{r.enabled=false;save();await syncRemPrefs();toast('Οι υπενθυμίσεις απενεργοποιήθηκαν')}
    const y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(el.dataset.rem){const r=S.settings.reminders,k=el.dataset.rem;r[k]=el.type==='checkbox'?el.checked:el.value;save();syncRemPrefs();
    if(el.type==='checkbox'){const y=window.scrollY;render();window.scrollTo(0,y)}return}
  if(el.dataset.weight){const v=parseFloat(String(el.value).replace(',','.'));const d=dayObj(el.dataset.weight);if(isNaN(v))delete d.weight;else d.weight=r1(v);save();toast('Το βάρος αποθηκεύτηκε');return}
  if(el.dataset.wizagree!==undefined&&wiz){wiz.agree=el.checked;return}
  if(el.dataset.actmeal){const [mi,ai_]=el.dataset.actmeal.split(':').map(Number);const a=chat.msgs[mi]&&chat.msgs[mi].actions[ai_];if(a){a.meal=el.value;saveChat()}return}
  if(el.id==='mealSel'){add.meal=el.value;return}
  if(el.dataset.aimeal!==undefined){ai.meal=el.value;return}
  if(el.dataset.aion!==undefined&&ai.result){ai.result.items[+el.dataset.aion].on=el.checked;render();return}
  if(el.dataset.aigrams!==undefined&&ai.result){ai.result.items[+el.dataset.aigrams].grams=Math.max(0,parseFloat(el.value)||0);const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(el.id==='fileCam'||el.id==='fileGal'){loadImage(el.files[0]);el.value='';return}
  if(el.id==='fileBarcode'){const file=el.files[0];el.value='';if(!file)return;
    try{await loadScript(QR_LIB);stopScanner();const tmp=new window.Html5Qrcode('reader',false);const code=await tmp.scanFile(file,false);tmp.clear();onBarcode(code)}
    catch(err){toast('Δεν βρέθηκε barcode στη φωτογραφία. Δοκίμασε πιο καθαρή λήψη.')}return}
  if(el.id==='fileImport'){const file=el.files[0];el.value='';if(!file)return;
    file.text().then(t=>{const j=JSON.parse(t);if(!j||typeof j!=='object'||!j.days)throw new Error('bad');
      if(!confirm('Η εισαγωγή θα αντικαταστήσει τα τρέχοντα δεδομένα σου. Συνέχεια;'))return;
      const c=S.consent;S=normalize(j);S.onboarded=true;S.consent=S.consent||c;save();applyTheme(S.settings.theme);render();toast('Η εισαγωγή ολοκληρώθηκε')}).catch(()=>toast('Μη έγκυρο αρχείο'))}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='gramsIn')A.addSel();
  if(e.key==='Enter'&&e.target.id==='codeIn')A.codeGo();
  if(e.key==='Enter'&&e.target.id==='q'){if(addList.length===1){add.sel=addList[0];add.grams=addList[0].portion||100;renderAdd()}else if(add.q.trim().length>=2&&!(add.off&&add.off.q===add.q.trim()))offSearch()}
});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('drag')}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z)z.classList.remove('drag')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(!z)return;e.preventDefault();z.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImage(f)});

boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
